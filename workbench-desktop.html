  /* ============================================================
     3D DEPTH — 立体层叠：高光顶边 + 分层投影 + 悬浮抬升
     ============================================================ */
  .main > #screen { perspective: 1400px; }
  /* 卡片类统一立体底：顶部一条高光 + 底部分层阴影 */
  .card, .rec, .panel, .modcard, .side-card, .mini, .pin, .q-btn, .qbtn, .hero, .hero-banner, .quote, .date-chip {
    position: relative;
  }
  .card::before, .rec::before, .panel::before, .modcard::before, .side-card::before, .mini::before,
  .pin::before, .qbtn::before, .hero::before, .date-chip::before {
    content: ""; position: absolute; inset: 0 0 auto 0; height: 1px; pointer-events: none;
    border-radius: inherit; background: linear-gradient(180deg, rgba(255,255,255,.55), rgba(255,255,255,0));
    mix-blend-mode: overlay; opacity: .7;
  }
  /* 3D 悬浮抬升 */
  .modcard, .rec, .qbtn, .pin, .mini {
    transition: transform .22s cubic-bezier(.2,.8,.3,1), box-shadow .22s, border-color .18s;
    transform-style: preserve-3d;
  }
  .modcard:hover { transform: translateY(-4px) rotateX(2deg); }
  .rec:hover { transform: translateY(-3px) rotateX(1.2deg); }
  .qbtn:hover { transform: translateY(-3px) rotateX(2deg); }
  .pin:hover { transform: translateY(-3px); }
  .mini:hover { transform: translateY(-2px); }
  /* 按钮 3D 按压 */
  .btn { transform: translateY(0); transition: transform .1s, filter .15s, box-shadow .15s;
    box-shadow: var(--shadow-card), 0 3px 0 rgba(0,0,0,.12); }
  .btn:hover { filter: brightness(1.08); transform: translateY(-1px); box-shadow: var(--shadow-card), 0 5px 0 rgba(0,0,0,.14); }
  .btn:active { transform: translateY(2px); box-shadow: var(--shadow-card), 0 1px 0 rgba(0,0,0,.12); }
  /* 侧栏导航立体选中 */
  .navi { transition: transform .15s, background .15s; }
  .navi:hover { transform: translateX(2px); }
  /* 主题/字体按钮 3D */
  .ts-opt, .fs-opt { transition: transform .15s, box-shadow .15s; }
  .ts-opt:hover { transform: scale(1.12) translateY(-1px); }
  .fs-opt:hover { transform: translateY(-2px); box-shadow: 0 3px 8px rgba(0,0,0,.18); }
  /* 输入框立体 */
  input, textarea { box-shadow: inset 0 1px 2px rgba(0,0,0,.04), var(--shadow-card); transition: border-color .15s, box-shadow .15s, transform .1s; }
  input:focus, textarea:focus { transform: translateY(-1px); }
  /* 模态窗立体 */
  .modal { box-shadow: 0 2px 0 rgba(255,255,255,.4) inset, 0 24px 60px rgba(0,0,0,.28); }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--page-bg); color: var(--text); font-family: var(--font); font-style: var(--font-style, normal); font-size: var(--font-size, 14px); font-weight: var(--font-weight, 400); line-height: 1.5;
    -webkit-font-smoothing: antialiased; min-height: 100vh; min-width: 1000px;
  }
  body::before { content:""; position:fixed; inset:0; z-index:-1; pointer-events:none;
    background-image: var(--page-texture); background-size: cover; background-position: center; opacity:.5; }
  svg { display: block; }
  .layout { min-height: 100vh; }

  /* ---------- sidebar (固定在左侧，不随内容滚动) ---------- */
  .sidebar { background: linear-gradient(180deg, var(--drawer-bg-top), var(--drawer-bg)); color: var(--drawer-text);
    display: flex; flex-direction: column; position: fixed; top: 0; left: 0; width: var(--sidebar-w); height: 100vh; z-index: 30; }
  .sidebar .brand { padding: 24px 20px 18px; display: flex; align-items: center; gap: 13px; }
  .sidebar .brand .ava { position: relative; width: 46px; height: 46px; border-radius: 13px; overflow: hidden; flex: 0 0 auto;
    background: var(--drawer-hover); box-shadow: 0 0 0 1px var(--drawer-active); cursor: pointer; }
  .sidebar .brand .ava img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .sidebar .brand .ava .cam { position: absolute; inset: 0; display: grid; place-items: center; opacity: 0;
    background: rgba(35,34,32,.5); color: var(--drawer-text); transition: opacity .15s; }
  .sidebar .brand .ava:hover .cam { opacity: 1; }
  .sidebar .brand h1 { font-size: 17px; font-weight: 800; letter-spacing: -.01em; }
  .sidebar .brand p { font-size: 11px; opacity: .5; margin-top: 3px; letter-spacing: .05em; }
  .sidebar .nav { flex: 1; overflow-y: auto; padding: 6px 12px 12px; }
  .sidebar .nav::-webkit-scrollbar { width: 6px; }
  .sidebar .nav::-webkit-scrollbar-thumb { background: var(--drawer-text-mute); border-radius: 6px; }
  .navi { display: flex; align-items: center; gap: 12px; padding: 11px 14px; border-radius: 11px; cursor: pointer;
    font-size: 14px; font-weight: 500; color: color-mix(in srgb, var(--drawer-text) 82%, transparent); transition: background .15s; margin-bottom: 2px; }
  .navi:hover { background: var(--drawer-hover); }
  .navi.active { background: var(--drawer-active); color: var(--drawer-text); font-weight: 700; }
  .navi svg { color: var(--drawer-text-mute); flex: 0 0 auto; }
  .navi.active svg { color: var(--drawer-text); }
  .nav-sep { font-size: 10.5px; opacity: .42; padding: 15px 14px 6px; letter-spacing: .1em; }
  .sidebar .foot { padding: 15px 20px; font-size: 11px; opacity: .42; border-top: 1px solid var(--drawer-hover); }
  .theme-switch { margin: 8px 16px 0; padding: 11px 14px; border-radius: var(--radius-tile);
    background: var(--drawer-hover); display:flex; align-items:center; gap:10px; }
  .ts-label { font-size: 11px; color: var(--drawer-text-mute); font-weight:600; letter-spacing:.04em; }
  .ts-options { display:flex; gap:8px; flex:1; justify-content:flex-end; }
  .ts-opt { width:24px; height:24px; border-radius:50%; border:none; padding:0; cursor:pointer;
    background:transparent; display:grid; place-items:center; transition: transform .15s; position:relative; }
  .ts-opt:hover { transform: scale(1.15); }
  .ts-opt .ts-dot { width:18px; height:18px; border-radius:50%; display:block; }
  .ts-opt.active .ts-dot { box-shadow: 0 0 0 2px var(--drawer-text); }
  .ts-opt.active::after { content:""; position:absolute; inset:-3px; border-radius:50%; border:1.5px solid var(--drawer-text); }

  /* font switcher */
  .font-switch { margin: 6px 16px 0; padding: 9px 14px; border-radius: var(--radius-tile);
    background: var(--drawer-hover); display:flex; align-items:center; gap:10px; }
  .font-opts { gap:5px; }
  .fs-opt { width:24px; height:24px; border-radius:7px; border:1px solid var(--drawer-text-mute);
    background: transparent; color: var(--drawer-text); font-size: 13px; cursor:pointer;
    display:grid; place-items:center; transition: all .15s; line-height:1; padding:0; }
  .fs-opt:hover { transform: translateY(-1px); border-color: var(--drawer-text); }
  .fs-opt.active { background: var(--drawer-text); color: var(--drawer-bg); border-color: var(--drawer-text); font-weight:700; }

  /* ---------- main ---------- */
  .main { margin-left: var(--sidebar-w); padding: 26px 34px 48px; }
  .main > #screen { max-width: 1180px; }
  .header { display: flex; align-items: flex-end; gap: 16px; margin-bottom: 6px; }
  .header h2 { font-size: 27px; font-weight: 800; letter-spacing: -.03em; }
  .header p { color: var(--text-secondary); font-size: 13px; margin-top: 5px; }
  .header .spacer { flex: 1; }
  .date-chip { display:inline-flex; align-items:center; gap:6px; font-size:13px; color:var(--text-secondary);
    background: var(--surface-card); border:1px solid var(--border); border-radius:999px; padding:8px 15px; box-shadow: var(--shadow-card); }
  .date-chip svg { color: var(--text-tertiary); }

  /* ---------- hero banner (顶部大图问候区) ---------- */
  .hero-banner { position: relative; overflow: hidden; border-radius: var(--radius-sheet); border: 1px solid var(--border);
    box-shadow: var(--shadow-card); min-height: 208px; display: flex; flex-direction: column; justify-content: center;
    padding: 34px 40px; margin-bottom: 24px;
    background: var(--surface-nested) var(--greet-image) right center / cover no-repeat; }
  .hero-banner::before { content:""; position:absolute; inset:0; pointer-events:none;
    background: linear-gradient(100deg, var(--surface-card) 34%, color-mix(in srgb, var(--surface-card) 82%, transparent) 52%, transparent 76%); }
  .hero-banner > * { position: relative; z-index: 1; }
  .hero-banner .hi { font-size: 34px; font-weight: 800; letter-spacing: -.03em; }
  .hero-banner .sub { color: var(--text-secondary); font-size: 14px; margin-top: 7px; max-width: 460px; }
  .hero-banner .hstats { display: flex; gap: 26px; margin-top: 22px; }
  .hero-banner .hstat { display: flex; flex-direction: column; gap: 2px; }
  .hero-banner .hstat .n { font-size: 22px; font-weight: 800; letter-spacing: -.02em; }
  .hero-banner .hstat .t { font-size: 12px; color: var(--text-secondary); }
  .hero-banner .hstat + .hstat { padding-left: 26px; border-left: 1px solid var(--border-input); }
  .hero-banner .htop { position: absolute; top: 22px; right: 26px; z-index: 2; display: flex; gap: 10px; align-items: center; }

  .card { background: var(--surface-card); border: 1px solid var(--border); border-radius: var(--radius-card); box-shadow: var(--shadow-card); }
  .sec-title { display:flex; align-items:center; gap:9px; font-size:14px; font-weight:800; margin: 18px 2px 10px; letter-spacing: -.01em; }
  .sec-title::before { content:""; width: 3px; height: 14px; border-radius: 2px; background: var(--accent); }

  /* ---------- dashboard grid ---------- */
  .grid { display: grid; gap: 16px; }
  .g-4 { grid-template-columns: repeat(4, 1fr); }
  .g-3 { grid-template-columns: repeat(3, 1fr); }
  .g-2 { grid-template-columns: repeat(2, 1fr); }
  .g-main { grid-template-columns: 1.55fr 1fr; align-items: start; }

  /* 各模块概况卡片 */
  .modcard-grid { display:grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .modcard { background: var(--surface-card); border: 1px solid var(--border); border-radius: var(--radius-card); box-shadow: var(--shadow-card);
    padding: 15px 16px; cursor: pointer; transition: transform .12s, box-shadow .18s, border-color .15s; }
  .modcard:hover { transform: translateY(-2px); box-shadow: var(--shadow-overlay); border-color: var(--border-input); }
  .modcard .mc-head { display:flex; align-items:center; gap: 11px; }
  .modcard .mc-ic { width: 36px; height: 36px; border-radius: 10px; display:grid; place-items:center; flex:0 0 auto; }
  .modcard .mc-tt { flex:1; min-width:0; }
  .modcard .mc-name { font-size: 14.5px; font-weight: 800; letter-spacing: -.01em; }
  .modcard .mc-desc { font-size: 11.5px; color: var(--text-secondary); margin-top: 1px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .modcard .mc-arw { color: var(--text-tertiary); flex:0 0 auto; }
  .modcard .mc-body { display:flex; align-items:baseline; gap: 8px; margin-top: 11px; }
  .modcard .mc-main { font-size: 15px; font-weight: 800; letter-spacing: -.01em; }
  .modcard .mc-extra { font-size: 12px; color: var(--text-secondary); }

  /* quote banner */
  .quote { padding: 22px 26px; border-radius: var(--radius-card); position: relative; overflow: hidden;
    background: var(--surface-card); border: 1px solid var(--border); box-shadow: var(--shadow-card); }
  .quote::before { content:""; position:absolute; left:0; top:18px; bottom:18px; width:3px; border-radius:2px; background: var(--accent); }
  .quote .tag { display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:700; color:var(--text-secondary);
    letter-spacing:.04em; margin-bottom:11px; }
  .quote .tag svg { color: var(--text-tertiary); }
  .quote .txt { font-size:20px; font-weight:700; color:var(--text); letter-spacing:-.01em; line-height:1.5; }

  /* overview rings */
  .rings { display:grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap:0; }
  .ring { display:flex; flex-direction:column; align-items:center; gap:8px; padding:12px 4px; cursor:pointer; min-width:0;
    border-radius: var(--radius-card); transition: background .15s; }
  .ring:hover { background: var(--surface-nested); }
  .ring .dial { position:relative; width:100%; max-width:128px; aspect-ratio:1; }
  .ring .dial svg.gauge { transform: rotate(-90deg); width:100%; height:100%; }
  .ring .dial .mid { position:absolute; inset:0; display:grid; place-items:center; }
  .ring .pct { font-size:18px; font-weight:800; letter-spacing:-.02em; }
  .ring .lbl { font-size:14.5px; font-weight:700; }
  .ring .sub { font-size:12px; color:var(--text-secondary); }

  /* quick add */
  .quick-grid { display:grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap:10px; }
  .qbtn { display:flex; align-items:center; gap:12px; padding:14px 15px; border:none; cursor:pointer; border-radius:var(--radius-tile);
    background:var(--surface-card); border:1px solid var(--border); box-shadow: var(--shadow-card); text-align:left; transition: all .15s; min-width:0; }
  .qbtn:hover { border-color:var(--border-input); transform: translateY(-1px); box-shadow: var(--shadow-overlay); }
  .qbtn .e { position:relative; width:42px; height:42px; border-radius:12px; display:grid; place-items:center; flex:0 0 auto; }
  .qbtn .e .qplus { position:absolute; right:-3px; bottom:-3px; width:17px; height:17px; border-radius:50%;
    background: var(--accent); color:var(--on-accent); display:grid; place-items:center; border: 2px solid var(--surface-card); }
  .qbtn .l { font-size:13.5px; font-weight:700; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--text); }
  [data-theme="starry"] .qbtn .e, [data-theme="crimson"] .qbtn .e { background:rgba(255,255,255,.08) !important; }
  [data-theme="starry"] .qbtn .l, [data-theme="crimson"] .qbtn .l { color:#eef2fb; }
  [data-theme="starry"] .modcard .mc-name, [data-theme="crimson"] .modcard .mc-name { color:#eef2fb; }
  [data-theme="starry"] .modcard .mc-desc, [data-theme="crimson"] .modcard .mc-desc { color:var(--text-tertiary); }
  [data-theme="starry"] .modcard .mc-main, [data-theme="crimson"] .modcard .mc-main { color:#eef2fb; }
  [data-theme="starry"] .modcard .mc-extra, [data-theme="crimson"] .modcard .mc-extra { color:var(--text-secondary); }
  [data-theme="starry"] .modcard .mc-ic, [data-theme="crimson"] .modcard .mc-ic { background:rgba(255,255,255,.08) !important; }
  [data-theme="starry"] .qbtn .l, [data-theme="crimson"] .qbtn .l { color:#e0f8ff; }
  [data-theme="starry"] .toast, [data-theme="crimson"] .toast { background:var(--surface-card); }

  /* trend panel */
  .panel { background: var(--surface-card); border: 1px solid var(--border); border-radius: var(--radius-card); box-shadow: var(--shadow-card); padding:18px; }
  .panel .ph { display:flex; align-items:center; gap:8px; font-size:14px; font-weight:800; }
  .panel .ph svg { color: var(--text-tertiary); }
  .panel .ph .avg { margin-left:auto; font-size:12px; color:var(--text-secondary); font-weight:500; }
  .trend-svg { width:100%; height:auto; margin-top:14px; display:block; }
  .trend-x { display:flex; justify-content:space-between; font-size:11px; color:var(--text-secondary); margin-top:4px; padding:0 6px; }
  .trend-empty { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; height: 168px;
    color: var(--text-tertiary); font-size: 13px; margin-top: 8px; }

  /* ---------- pinned tasks ---------- */
  .pin-list { display:grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .pin { display:flex; align-items:center; gap: 13px; padding: 15px 16px; border-radius: var(--radius-tile);
    background: var(--surface-card); border: 1px solid var(--border); box-shadow: var(--shadow-card); transition: box-shadow .15s, transform .12s; }
  .pin:hover { box-shadow: var(--shadow-overlay); transform: translateY(-1px); }
  .pin-ic { width: 38px; height: 38px; border-radius: 11px; display:grid; place-items:center; flex:0 0 auto;
    background: var(--surface-nested); border: 1px solid var(--border); }
  .pin-b { flex:1; min-width:0; cursor:pointer; }
  .pin-t { font-size: 14.5px; font-weight: 700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .pin-t.done { text-decoration: line-through; color: var(--text-secondary); }
  .pin-m { font-size: 12px; color: var(--text-secondary); margin-top: 3px; }
  .pin-chk { flex:0 0 auto; width: 26px; height: 26px; border-radius: 8px; border: 1.6px solid var(--border-input);
    display:grid; place-items:center; cursor:pointer; background:var(--surface-card); color:var(--on-accent); transition: all .15s; }
  .pin-chk.on { background: var(--module-1); border-color: var(--module-1); }
  .pin-chk svg { opacity: 0; }
  .pin-chk.on svg { opacity: 1; }
  .pin-step { flex:0 0 auto; display:flex; gap: 7px; }
  .pin-step button { width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--border-input);
    background: var(--surface-nested); color: var(--text); font-size: 18px; line-height: 1; cursor:pointer;
    display:grid; place-items:center; transition: all .15s; }
  .pin-step button:hover { background: var(--accent-muted); border-color: var(--accent); }
  .pin-empty { grid-column: 1 / -1; padding: 26px 20px; text-align:center; color: var(--text-secondary); font-size: 13px; line-height: 1.7;
    background: var(--surface-card); border: 1px dashed var(--border-input); border-radius: var(--radius-tile); }
  .pin-empty .mini-star { display:inline-flex; vertical-align:-2px; color: var(--module-3); }

  /* ---------- toolbar in module view ---------- */
  .toolbar { display:flex; align-items:center; gap:10px; margin: 14px 0 12px; }
  .btn { background:var(--accent); color:var(--on-accent); border:none; border-radius:10px; padding:10px 18px; font-size:14px; cursor:pointer;
    font-weight:700; box-shadow: var(--shadow-card); transition: filter .15s, transform .1s; display:inline-flex; align-items:center; gap:7px; }
  .btn:hover { filter: brightness(1.12); } .btn:active { transform: translateY(1px); }
  .btn.ghost { background:var(--surface-card); color:var(--text-secondary); border:1px solid var(--border-input); box-shadow:none; font-weight:500; }
  .btn.ghost:hover { color:var(--text); }
  .btn.danger { background:var(--danger); }
  .spacer { flex:1; }
  input, textarea { font-family:var(--font); font-size:var(--font-size, 14px); border:1px solid var(--border-input); border-radius:10px;
    padding:9px 12px; background:var(--surface-card); color:var(--text); outline:none; transition: border-color .15s, box-shadow .15s; width:100%; }
  input:focus, textarea:focus { border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-muted); }
  textarea { resize:vertical; min-height:80px; }
  .search-box { position:relative; width: 240px; }
  .search-box svg { position:absolute; left:11px; top:50%; transform:translateY(-50%); color:var(--text-tertiary); pointer-events:none; }
  .search-box input { padding-left:34px; }
  /* 待办排序 + 视图切换 */
  .todo-ctrls { display:flex; gap:8px; align-items:center; }
  .mini-seg { gap:4px; }
  .mini-seg .opt { flex:0 0 auto; padding:6px 11px; font-size:12px; min-width:auto; border-radius:8px; }
  .mini-seg .opt svg { vertical-align:-2px; }
  /* 四象限视图 */
  .quad-view { position:relative; padding: 10px 10px 10px 28px; }
  .quad-axis-y { position:absolute; left:2px; top:50%; transform:translateY(-50%);
    writing-mode:vertical-rl; text-orientation:upright;
    font-size:11px; color:var(--text-tertiary); letter-spacing:.12em; font-weight:600; }
  .quad-axis-x { text-align:center; font-size:11px; color:var(--text-tertiary); margin-top:8px; letter-spacing:.12em; font-weight:600; }
  .quad-grid { display:grid; grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr; gap:12px; min-height:420px; }
  .q-col { background:var(--surface-card); border:1px solid var(--border); border-radius:var(--radius-card);
    box-shadow:var(--shadow-card); padding:14px 16px; display:flex; flex-direction:column; min-height:0;
    transition:box-shadow .15s, border-color .15s; }
  .q-col.drag-over { border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-muted); }
  .q-head { display:flex; align-items:center; justify-content:space-between; padding-left:10px; border-left:4px solid; padding-bottom:10px; margin-bottom:10px; border-bottom:1px solid var(--border); }
  .qh-l { font-size:13px; font-weight:800; }
  .qh-n { font-size:12px; color:var(--text-tertiary); font-weight:600; }
  .q-items { flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:6px; }
  .q-item { display:flex; align-items:center; gap:9px; padding:8px 10px; border-radius:var(--radius-tile);
    background:var(--surface-nested); cursor:grab; transition:background .12s, opacity .12s; }
  .q-item:hover { background:var(--accent-muted); }
  .q-item.dragging { opacity:.4; }
  .q-item.done .qi-t { text-decoration:line-through; color:var(--text-tertiary); }
  .qi-chk { width:18px; height:18px; border-radius:5px; border:1.5px solid var(--border-input); flex:0 0 auto;
    display:grid; place-items:center; cursor:pointer; background:var(--surface-card); color:var(--on-accent); }
  .qi-chk.on { background:var(--module-1); border-color:var(--module-1); }
  .qi-body { flex:1; min-width:0; }
  .qi-t { font-size:13px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .qi-r { font-size:11px; color:var(--text-tertiary); margin-top:2px; display:flex; align-items:center; gap:3px; }
  .qi-iu { font-size:10.5px; color:var(--text-tertiary); flex:0 0 auto; font-weight:700; }
  .q-empty { text-align:center; color:var(--text-tertiary); font-size:12px; padding:24px 0; }
  .q-drop-hint { text-align:center; color:var(--text-tertiary); font-size:11px; padding:8px 0; opacity:0; transition:opacity .15s; }
  .q-col.drag-over .q-drop-hint { opacity:1; }

  /* ===== 游戏化习惯打卡卡片 ===== */
  .habit-game { display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:16px; }
  .hc-card { position:relative; background:var(--surface-card); border:1px solid var(--border);
    border-radius:16px; box-shadow:var(--shadow-card); padding:18px 20px; overflow:hidden;
    transition:transform .2s, box-shadow .2s; }
  .hc-card:hover { transform:translateY(-2px); box-shadow:0 8px 24px rgba(0,0,0,.12); }
  .hc-card.done { border-color:var(--hc-color, var(--module-1)); }
  .hc-card::before { content:''; position:absolute; top:0; left:0; right:0; height:4px;
    background:linear-gradient(90deg, var(--hc-color, var(--module-1)), transparent 70%); }
  .hc-top { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .hc-name { font-size:15px; font-weight:800; display:flex; align-items:center; gap:8px; }
  .hc-check { width:28px; height:28px; border-radius:50%; border:2.5px solid var(--border-input);
    display:grid; place-items:center; cursor:pointer; transition:all .2s; flex:0 0 auto; background:var(--surface-card); color:var(--on-accent); }
  .hc-check.on { background:var(--hc-color, var(--module-1)); border-color:var(--hc-color, var(--module-1)); transform:scale(1.05); }
  .hc-check:hover { border-color:var(--hc-color, var(--module-1)); }
  .hc-lv-badge { display:inline-flex; align-items:center; gap:4px; padding:3px 10px; border-radius:20px;
    font-size:11px; font-weight:800; letter-spacing:.03em; white-space:nowrap;
    background:var(--hc-tint, var(--accent-muted)); color:var(--hc-color, var(--accent)); }
  .hc-body { display:flex; align-items:center; gap:16px; margin-bottom:14px; }
  .hc-ring-wrap { position:relative; width:64px; height:64px; flex:0 0 auto; }
  .hc-ring-wrap svg { transform:rotate(-90deg); }
  .hc-ring-mid { position:absolute; inset:0; display:grid; place-items:center; }
  .hc-ring-num { font-size:16px; font-weight:900; }
  .hc-ring-cap { font-size:9px; color:var(--text-tertiary); }
  .hc-stats { flex:1; min-width:0; }
  .hc-streak { display:flex; align-items:center; gap:6px; font-size:15px; font-weight:800; margin-bottom:4px; }
  .hc-streak svg { color:#e8702a; }
  .hc-total { font-size:12px; color:var(--text-tertiary); margin-bottom:8px; }
  .hc-lvbar { height:7px; border-radius:4px; background:var(--surface-nested); overflow:hidden; }
  .hc-lvbar i { display:block; height:100%; border-radius:4px; background:var(--hc-color, var(--module-1)); transition:width .4s ease; }
  .hc-lvbar-text { font-size:10px; color:var(--text-tertiary); margin-top:3px; display:flex; justify-content:space-between; }
  .hc-week { display:flex; gap:4px; margin-bottom:12px; }
  .hc-wd { flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; }
  .hc-wd .dot { width:24px; height:24px; border-radius:7px; background:var(--surface-nested);
    display:grid; place-items:center; font-size:10px; transition:all .15s; }
  .hc-wd .dot.on { background:var(--hc-color, var(--module-1)); color:var(--on-accent); }
  .hc-wd .dot.today { border:2px solid var(--hc-color, var(--module-1)); }
  .hc-wd .lbl { font-size:9.5px; color:var(--text-tertiary); font-weight:600; }
  .hc-reward { display:flex; align-items:center; gap:6px; padding:8px 12px; border-radius:10px;
    background:var(--hc-tint, var(--accent-muted)); font-size:12px; }
  .hc-reward svg { color:var(--hc-color, var(--accent)); flex:0 0 auto; }
  .hc-reward .hc-rw-text { color:var(--text-secondary); font-weight:600; }
  .hc-reward .hc-rw-next { color:var(--text-tertiary); font-size:11px; margin-left:auto; }
  /* 暗色主题习惯卡片对比度提升 */
  [data-theme="starry"] .hc-total, [data-theme="crimson"] .hc-total { color:rgba(255,255,255,.7); }
  [data-theme="starry"] .hc-lvbar-text, [data-theme="crimson"] .hc-lvbar-text { color:rgba(255,255,255,.65); }
  [data-theme="starry"] .hc-ring-cap, [data-theme="crimson"] .hc-ring-cap { color:rgba(255,255,255,.5); }
  [data-theme="starry"] .hc-wd .lbl, [data-theme="crimson"] .hc-wd .lbl { color:rgba(255,255,255,.6); }
  [data-theme="starry"] .hc-wd .dot, [data-theme="crimson"] .hc-wd .dot { background:rgba(255,255,255,.08); color:rgba(255,255,255,.5); }
  [data-theme="starry"] .hc-wd .dot.on, [data-theme="crimson"] .hc-wd .dot.on { color:#fff; }
  [data-theme="starry"] .hc-lvbar, [data-theme="crimson"] .hc-lvbar { background:rgba(255,255,255,.1); }
  [data-theme="starry"] .hc-reward, [data-theme="crimson"] .hc-reward {
    background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.08);
  }
  [data-theme="starry"] .hc-reward .hc-rw-text, [data-theme="crimson"] .hc-reward .hc-rw-text { color:rgba(255,255,255,.8); }
  [data-theme="starry"] .hc-reward .hc-rw-next, [data-theme="crimson"] .hc-reward .hc-rw-next { color:rgba(255,255,255,.5); }
  [data-theme="starry"] .hc-lv-badge, [data-theme="crimson"] .hc-lv-badge { background:rgba(255,255,255,.1); }

  /* module hero header (per-type summary) */
  .hero { display:flex; align-items:center; gap: 13px; padding: 12px 16px; border-radius: var(--radius-tile);
    background: var(--surface-card); border: 1px solid var(--border); box-shadow: var(--shadow-card); margin-bottom: 4px; position:relative; overflow:hidden; }
  .hero.has-cover { padding: 0; min-height: 96px; }
  .hero.has-cover .hero-bg { position:absolute; inset:0; background-size:cover; background-position:center; }
  .hero.has-cover .hero-bg::after { content:""; position:absolute; inset:0; background: linear-gradient(90deg, var(--surface-card) 28%, color-mix(in srgb, var(--surface-card) 60%, transparent) 55%, transparent 80%); }
  .hero.has-cover > .hero-inner { position:relative; z-index:1; padding: 12px 16px; display:flex; align-items:center; gap:13px; }
  .hero-ic { width: 40px; height: 40px; border-radius: 11px; display:grid; place-items:center; flex:0 0 auto; }
  .hero-tx { min-width:0; flex:1; }
  .hero-row { display:flex; align-items:baseline; gap: 9px; flex-wrap:wrap; }
  .hero-v { font-size: 20px; font-weight: 800; letter-spacing: -.02em; line-height: 1; }
  .hero-l { font-size: 13px; color: var(--text-secondary); }

  /* record thumbnail + custom field meta tags */
  .rec .thumb { width:48px; height:48px; border-radius:var(--radius-tile); object-fit:cover; flex:0 0 auto; margin-right:2px; }
  .rec .meta-line { display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-top:4px; flex:1 0 100%; }
  .rec .meta-tag { font-size:12px; font-weight:600; color:var(--text-secondary); }
  .rec .meta-tag::before { content:"·"; margin-right:6px; color:var(--text-tertiary); }
  .rec .meta-tag:first-child::before { display:none; }

  /* ---- layout variants (open-ended: add .rec-layout-xxx in <style> to extend) ---- */
  /* feature: 大图在上 + 标题 + 正文在下 */
  .rec.rec-layout-feature { padding:0; overflow:hidden; }
  .rec.rec-layout-feature .top { flex-direction:column; align-items:stretch; }
  .rec.rec-layout-feature .thumb { width:100%; height:160px; border-radius:0; margin:0; }
  .rec.rec-layout-feature .feat-title { padding:12px 16px 4px; font-size:15px; font-weight:700; color:var(--text); }
  .rec.rec-layout-feature .feat-body { padding:0 16px 14px; font-size:13px; color:var(--text-secondary); line-height:1.55; }
  /* quote: 大字居中 + 留白 */
  .rec.rec-layout-quote { padding:24px 20px; }
  .rec.rec-layout-quote .quote-text { font-size:18px; font-weight:600; line-height:1.6; color:var(--text); }
  .rec.rec-layout-quote .quote-meta { margin-top:10px; font-size:12px; color:var(--text-tertiary); }

  /* ============ 手帐书本视图（灵感备忘） ============ */
  .book-view { position: relative; padding: 26px 22px 30px; border-radius: var(--radius-card);
    background: linear-gradient(135deg, var(--surface-card), var(--surface-nested));
    border: 1px solid var(--border); box-shadow: var(--shadow-card), 0 18px 44px rgba(0,0,0,.16);
    transform-style: preserve-3d; }
  .book-view::before { content:""; position:absolute; left:50%; top:0; bottom:0; width:3px; transform:translateX(-50%);
    background: linear-gradient(180deg, var(--border), color-mix(in srgb, var(--border) 40%, transparent));
    box-shadow: 0 0 12px rgba(0,0,0,.12); border-radius: 2px; }
  .book-spine-label { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%) rotate(-90deg);
    font-size: 11px; letter-spacing:.3em; color:var(--text-tertiary); font-weight:700; text-transform:uppercase; opacity:.6; pointer-events:none; }
  .book-pages { display:grid; grid-template-columns: 1fr 1fr; gap: 22px 26px; position:relative; z-index:1; }
  .note-page { position:relative; background: var(--surface-card); border:1px solid var(--border);
    border-radius: 6px; padding: 18px 18px 16px; min-height: 170px;
    box-shadow: 0 2px 8px rgba(0,0,0,.06), inset 0 1px 0 rgba(255,255,255,.5);
    transition: transform .2s, box-shadow .2s; cursor:pointer;
    background-image: repeating-linear-gradient(180deg, transparent 0, transparent 27px, color-mix(in srgb, var(--accent) 10%, transparent) 27px, color-mix(in srgb, var(--accent) 10%, transparent) 28px);
    background-size: 100% 28px; }
  .note-page::after { content:""; position:absolute; left:0; top:8px; bottom:8px; width:2px; background: var(--danger); opacity:.5; border-radius:2px; }
  .note-page:hover { transform: translateY(-3px) rotate(-.5deg); box-shadow: 0 10px 24px rgba(0,0,0,.14); }
  .note-page .np-head { display:flex; align-items:baseline; gap:8px; margin-bottom:8px; padding-bottom:6px; border-bottom:1px dashed var(--border); }
  .note-page .np-title { font-size: 15px; font-weight:700; color:var(--text); letter-spacing:-.01em; flex:1; min-width:0; }
  .note-page .np-mood { font-size:11px; font-weight:700; padding:2px 9px; border-radius:999px; background:var(--accent-muted); color:var(--accent); white-space:nowrap; }
  .note-page .np-body { font-size: 13.5px; line-height: 28px; color:var(--text); white-space:pre-wrap; word-break: break-word; }
  .note-page .np-foot { display:flex; align-items:center; justify-content:space-between; margin-top:10px; font-size:11px; color:var(--text-tertiary); }
  .note-page .np-acts { display:flex; gap:2px; opacity:.5; }
  .note-page .np-acts button { border:none; background:transparent; color:var(--text-tertiary); cursor:pointer; width:24px; height:24px; border-radius:6px; display:grid; place-items:center; }
  .note-page .np-acts button:hover { background:var(--surface-nested); color:var(--text); }
  .note-page .np-acts .pin-btn.on { color:var(--module-3); }
  .book-empty { grid-column: 1 / -1; text-align:center; padding: 60px 20px; color:var(--text-secondary); }
  @media (max-width: 900px) { .book-pages { grid-template-columns: 1fr; } .book-view::before, .book-spine-label { display:none; } }


  /* module two-column layout: 左记录 / 右统计侧栏 */
  .mod-layout { display:grid; grid-template-columns: 1fr 300px; gap: 16px; align-items: start; margin-top: 14px; }
  .mod-side { display:flex; flex-direction:column; gap: 12px; position: sticky; top: 16px; }
  .side-card { background:var(--surface-card); border:1px solid var(--border); border-radius:var(--radius-tile); box-shadow:var(--shadow-card); padding:14px 15px; }
  .side-card .sh { display:flex; align-items:center; gap:8px; font-size:12.5px; font-weight:800; margin-bottom:10px; }
  .side-card .sh svg { color:var(--text-tertiary); }
  .stat-row { display:flex; align-items:center; justify-content:space-between; padding:6px 0; border-bottom:1px solid var(--border); }
  .stat-row:last-child { border-bottom:none; padding-bottom:0; }
  .stat-row .k { font-size:12.5px; color:var(--text-secondary); display:flex; align-items:center; gap:7px; }
  .stat-row .k .kd { width:8px; height:8px; border-radius:50%; flex:0 0 auto; }
  .stat-row .val { font-size:14px; font-weight:800; letter-spacing:-.01em; }
  /* 分类占比条 */
  .catbar { margin-top:4px; }
  .catbar .cbrow { display:flex; align-items:center; gap:9px; padding:7px 0; }
  .catbar .cbrow .cbn { font-size:12.5px; color:var(--text); width:52px; flex:0 0 auto; }
  .catbar .cbrow .cbt { flex:1; height:8px; border-radius:999px; background:var(--border); overflow:hidden; }
  .catbar .cbrow .cbt i { display:block; height:100%; border-radius:999px; }
  .catbar .cbrow .cbv { font-size:12px; color:var(--text-secondary); width:56px; text-align:right; flex:0 0 auto; }
  /* 大环形（进度/打卡侧栏） */
  .side-ring { display:flex; flex-direction:column; align-items:center; gap:8px; padding:6px 0 2px; }
  .side-ring .dial { position:relative; width:120px; height:120px; }
  .side-ring .dial svg.gauge { transform: rotate(-90deg); width:120px; height:120px; }
  .side-ring .dial .mid { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; }
  .side-ring .big { font-size:26px; font-weight:800; letter-spacing:-.02em; }
  .side-ring .cap { font-size:12px; color:var(--text-secondary); }

  /* finance summary minis */
  .mod-summary { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom: 4px; }
  .mini { background:var(--surface-card); border:1px solid var(--border); border-radius:var(--radius-tile); box-shadow:var(--shadow-card); padding:12px 14px; }
  .mini .l { font-size:12px; color:var(--text-secondary); }
  .mini .v { font-size:19px; font-weight:800; margin-top:3px; letter-spacing:-.02em; }

  /* record list — 行式列表 */
  .rec-grid { display:flex; flex-direction:column; gap:9px; }
  .rec { position:relative; background:var(--surface-card); border:1px solid var(--border); border-radius:var(--radius-tile); box-shadow:var(--shadow-card); padding:14px 16px; transition: border-color .15s, box-shadow .18s, transform .15s; }
  .rec:hover { border-color: color-mix(in srgb, var(--accent) 40%, var(--border)); box-shadow: var(--shadow-overlay); transform: translateY(-1px); }
  .rec[data-urgent="overdue"] { border-color:#e8b8b0; box-shadow:0 0 0 3px rgba(194,93,79,.08); }
  .rec .top { display:flex; align-items:center; gap:12px; }
  .rec .chk { flex:0 0 auto; width:23px; height:23px; border-radius:7px; border:1.6px solid var(--border-input); display:grid; place-items:center;
    cursor:pointer; background:var(--surface-card); color:var(--on-accent); transition: all .15s; }
  .rec .chk.on { background:var(--module-1); border-color:var(--module-1); }
  .rec .chk svg { opacity:0; } .rec .chk.on svg { opacity:1; }
  .rec .body { flex:1; min-width:0; cursor:pointer; display:flex; align-items:center; gap:11px; flex-wrap:wrap; }
  .rec .rname { font-weight:700; font-size:14.5px; letter-spacing:-.01em; flex:0 1 auto; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:100%; }
  .rec .rname.done { text-decoration:line-through; color:var(--text-secondary); }
  .rec .rmeta { display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
  .rec .rnote { flex:1 0 100%; color:var(--text-secondary); font-size:12.5px; margin-top:5px; white-space:pre-wrap; line-height:1.5;
    overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
  .badge { display:inline-flex; align-items:center; gap:5px; padding:2px 9px; border-radius:999px; font-size:11.5px; font-weight:700; }
  .remind-badge { display:inline-flex; align-items:center; gap:5px; padding:4px 11px; border-radius:999px;
    font-size:12.5px; font-weight:700; border:1px solid transparent; white-space:nowrap;
    box-shadow:0 1px 4px rgba(0,0,0,.06); }
  .remind-badge.overdue { animation: pulse-red 1.6s ease-in-out infinite; }
  .remind-badge.today { font-weight:800; }
  @keyframes pulse-red { 0%,100% { box-shadow:0 0 0 0 rgba(194,93,79,.35); } 50% { box-shadow:0 0 0 5px rgba(194,93,79,0); } }
  .badge .dot { width:6px; height:6px; border-radius:50%; background:currentColor; }
  .iu-badge { display:inline-flex; align-items:center; padding:2px 8px; border-radius:999px; font-size:10.5px;
    font-weight:800; background:var(--surface-nested); color:var(--text-secondary); border:1px solid var(--border);
    letter-spacing:.02em; font-family:var(--font); }
  .rec .acts { position:absolute; top:50%; right:8px; transform:translateY(-50%); display:flex; gap:1px; opacity:0; transition: opacity .15s; background:var(--surface-card); }
  .rec:hover .acts { opacity:1; }
  .rec .acts button { border:none; background:transparent; color:var(--text-tertiary); cursor:pointer;
    width:28px; height:28px; border-radius:7px; display:grid; place-items:center; transition: all .15s; }
  .rec .pin-btn:hover { background:var(--surface-nested); color:var(--module-3); }
  .rec .pin-btn.on { color:var(--module-3); opacity:1; } .rec .pin-btn.on svg { fill: var(--module-3); }
  .rec:has(.pin-btn.on) .acts { opacity:1; }
  .rec .del:hover { background:var(--danger-muted); color:var(--danger); }
  .rec .pbar { flex:1; min-width:80px; height:6px; border-radius:999px; background:var(--border); overflow:hidden; }
  .rec .pbar i { display:block; height:100%; border-radius:999px; }
  .rec .amt { font-size:15px; font-weight:800; letter-spacing:-.02em; white-space:nowrap; margin-left:auto; }
  .rec .amt.exp { color:var(--danger); } .rec .amt.inc { color:var(--module-1); }
  .rec .streak { font-size:11.5px; color:var(--module-3); font-weight:700; display:inline-flex; align-items:center; gap:4px; }
  .rec .rdate { color:var(--text-secondary); font-size:11.5px; margin-left:auto; white-space:nowrap; }
  .empty { text-align:center; color:var(--text-secondary); padding:50px 20px; }
  .empty .e { display:inline-grid; place-items:center; width:56px; height:56px; border-radius:16px; background:var(--surface-card); border:1px solid var(--border); color:var(--text-tertiary); margin-bottom:12px; }

  /* ---------- modal ---------- */
  .overlay { position:fixed; inset:0; background:color-mix(in srgb, var(--text) 44%, transparent); backdrop-filter: blur(3px); z-index:60;
    display:flex; align-items:center; justify-content:center; animation: fade .16s ease; }
  @keyframes fade { from { opacity:0; } }
  .modal { background:var(--surface-card); border-radius:20px; padding:26px; width:480px; max-width:92vw; max-height:90vh; overflow-y:auto;
    box-shadow:0 24px 60px color-mix(in srgb, var(--text) 26%, transparent); animation: pop .18s cubic-bezier(.2,.8,.3,1); }
  @keyframes pop { from { transform: translateY(10px) scale(.98); opacity:0; } }
  .modal h3 { font-size:19px; font-weight:800; letter-spacing:-.01em; }
  /* modal head/body/foot 结构（用于 LLM 设置等复杂弹窗） */
  .modal-head { display:flex; align-items:center; gap:12px; margin-bottom:6px; }
  .modal-head h3 { margin:0; flex:1; }
  .modal-x { width:32px; height:32px; border-radius:50%; border:none; background:var(--surface-nested);
    color:var(--text-secondary); font-size:18px; cursor:pointer; display:grid; place-items:center;
    line-height:1; transition:all .15s; flex:0 0 auto; }
  .modal-x:hover { background:var(--danger-muted); color:var(--danger); }
  .modal-body { padding:4px 0; }
  .modal-foot { display:flex; align-items:center; gap:10px; margin-top:20px; padding-top:16px;
    border-top:1px solid var(--border); }
  .modal-foot .spacer { flex:1; }
  .modal .sub { color:var(--text-secondary); font-size:13px; margin:5px 0 18px; }
  .field { margin-bottom:14px; }
  .field label { display:block; color:var(--text-secondary); font-size:13px; margin-bottom:6px; }
  /* 四象限选择器 */
  .quad-picker { display:grid; grid-template-columns: 22px 1fr; grid-template-rows: 1fr 18px; gap:4px; align-items:center; }
  .qp-y { writing-mode:vertical-lr; text-orientation:upright; font-size:10px; color:var(--text-tertiary); text-align:center; letter-spacing:.1em; }
  .qp-x { grid-column:2; font-size:10px; color:var(--text-tertiary); text-align:center; letter-spacing:.1em; }
  .qp-grid { display:grid; grid-template-columns:repeat(5,1fr); gap:3px; grid-column:2; grid-row:1; }
  .qp-cell { aspect-ratio:1; border-radius:5px; cursor:pointer; transition:transform .12s, box-shadow .12s; border:1.5px solid transparent; }
  .qp-cell:hover { transform:scale(1.12); z-index:2; }
  .qp-cell.q1 { background:#fbeaea; }
  .qp-cell.q2 { background:#e8f0f6; }
  .qp-cell.q3 { background:#fbf3e2; }
  .qp-cell.q4 { background:#f0eee9; }
  .qp-cell.on { box-shadow:0 0 0 2.5px var(--accent), 0 2px 8px rgba(0,0,0,.18); transform:scale(1.12); border-color:var(--accent); }
  .qp-legend { display:flex; flex-wrap:wrap; gap:10px; margin-top:8px; }
  .qp-legend .ql { font-size:11px; color:var(--text-secondary); display:inline-flex; align-items:center; gap:5px; }
  .qp-legend .ql::before { content:""; width:10px; height:10px; border-radius:3px; }
  .qp-legend .ql.q1::before { background:#fbeaea; }
  .qp-legend .ql.q2::before { background:#e8f0f6; }
  .qp-legend .ql.q3::before { background:#fbf3e2; }
  .qp-legend .ql.q4::before { background:#f0eee9; }
  .frow { display:flex; gap:12px; } .frow .field { flex:1; }
  .seg { display:flex; gap:8px; flex-wrap:wrap; }
  .seg .opt { flex:1; min-width:64px; text-align:center; padding:10px; border-radius:11px; border:1px solid var(--border-input);
    cursor:pointer; font-size:13px; font-weight:600; color:var(--text-secondary); transition: all .12s; }
  .seg .opt.on { background:var(--accent); border-color:var(--accent); color:var(--on-accent); }
  .modal-actions { display:flex; align-items:center; gap:10px; margin-top:22px; }
  .link-danger { color:var(--danger); background:none; border:none; font-size:14px; font-weight:600; cursor:pointer; padding:8px 10px; border-radius:8px; }
  .link-danger:hover { background:var(--danger-muted); }

  /* ============================================================
     BENTO DASHBOARD — 首页复杂网格布局（墨色中性 · 高密度）
     ============================================================ */
  .bento { display:grid; grid-template-columns: repeat(12, 1fr); gap:16px; align-items:stretch; }
  .bento > * { min-width:0; }   /* 允许网格轨道收窄，避免窄屏内容溢出 */
  .b3{grid-column:span 3} .b4{grid-column:span 4} .b5{grid-column:span 5}
  .b6{grid-column:span 6} .b7{grid-column:span 7} .b8{grid-column:span 8} .b12{grid-column:span 12}

  /* 分组标题（EN 副标题 + 中文标题 + 分隔线） */
  .sec-grp { display:flex; align-items:center; gap:12px; margin:26px 2px 14px; }
  .sec-grp .bar { width:4px; height:19px; border-radius:2px; background:var(--accent); flex:0 0 auto; }
  .sec-grp .zh { font-size:16px; font-weight:800; letter-spacing:-.02em; }
  .sec-grp .en { font-size:10.5px; font-weight:800; letter-spacing:.15em; color:var(--text-tertiary); }
  .sec-grp .line { flex:1; height:1px; background:var(--border); }

  /* 通用瓷砖 */
  .tile { background:var(--surface-card); border:1px solid var(--border); border-radius:var(--radius-card); box-shadow:var(--shadow-card);
    padding:18px 20px; display:flex; flex-direction:column; }
  .tile-h { display:flex; align-items:center; gap:9px; margin-bottom:14px; }
  .tile-h .tic { color:var(--text-tertiary); display:flex; }
  .tile-h .en { font-size:9.5px; font-weight:800; letter-spacing:.14em; color:var(--text-tertiary); line-height:1; }
  .tile-h .zh { font-size:14px; font-weight:800; letter-spacing:-.01em; line-height:1.15; }
  .tile-h .tt { display:flex; flex-direction:column; gap:3px; }
  .tile-h .r { margin-left:auto; font-size:12px; color:var(--text-secondary); font-weight:700; }

  /* 整体情况瓷砖 */
  .ov2-body { display:grid; grid-template-columns:1fr 300px; gap:22px; flex:1; align-items:stretch; }
  .ov2-body .rings { align-content:center; }
  .ov2-side { position:relative; overflow:hidden; border-radius:var(--radius-card);
    background:linear-gradient(150deg,var(--drawer-bg-top) 0%,var(--drawer-bg) 62%,var(--accent) 100%); box-shadow:var(--shadow-overlay);
    padding:20px; display:flex; flex-direction:column; justify-content:space-between; gap:12px; color:var(--drawer-text); }
  .ov2-side::before { content:""; position:absolute; width:190px; height:190px; border-radius:50%; right:-70px; top:-80px;
    background:radial-gradient(circle,rgba(95,122,153,.4),transparent 70%); pointer-events:none; }
  .ov2-side::after { content:""; position:absolute; width:150px; height:150px; border-radius:50%; left:-55px; bottom:-70px;
    background:radial-gradient(circle,rgba(189,138,78,.32),transparent 70%); pointer-events:none; }
  .ov2-stat { position:relative; z-index:1; display:flex; align-items:center; gap:13px; cursor:pointer;
    padding:12px 4px; border-radius:var(--radius-tile); transition:background .15s; }
  .ov2-stat:hover { background:rgba(244,243,240,.06); }
  .ov2-stat + .ov2-stat { border-top:1px solid rgba(244,243,240,.09); }
  .ov2-stat .s-ic { width:40px; height:40px; border-radius:12px; display:grid; place-items:center; flex:0 0 auto;
    background:rgba(244,243,240,.08); box-shadow:inset 0 0 0 1px rgba(244,243,240,.1); }
  .ov2-stat .s-tx { min-width:0; }
  .ov2-stat .s-v { font-size:24px; font-weight:800; letter-spacing:-.03em; line-height:1.05; color:#f4f3f0;
    font-variant-numeric:tabular-nums; }
  .ov2-stat .s-l { font-size:11.5px; color:rgba(244,243,240,.55); margin-top:3px; }

  /* 大时钟卡（暗色·点缀光晕） */
  .clock-card { position:relative; overflow:hidden; border-radius:var(--radius-sheet);
    background:linear-gradient(140deg,var(--drawer-bg-top) 0%,var(--drawer-bg) 60%,var(--accent) 100%); color:var(--drawer-text);
    padding:26px 28px; box-shadow:var(--shadow-overlay); display:flex; flex-direction:column; justify-content:space-between; min-height:196px; }
  .clock-card::before { content:""; position:absolute; width:220px; height:220px; border-radius:50%; right:-70px; top:-90px;
    background:radial-gradient(circle,rgba(189,138,78,.35),transparent 70%); }
  .clock-card::after { content:""; position:absolute; width:170px; height:170px; border-radius:50%; left:-60px; bottom:-80px;
    background:radial-gradient(circle,rgba(111,143,106,.28),transparent 70%); }
  .clock-card > * { position:relative; z-index:1; }
  .clock-card .hi { font-size:24px; font-weight:800; letter-spacing:-.02em; }
  .clock-card .sub { font-size:12.5px; opacity:.62; margin-top:5px; max-width:230px; line-height:1.5; }
  .clock-card .clk { font-size:clamp(38px,4.4vw,50px); font-weight:800; letter-spacing:.01em; font-variant-numeric:tabular-nums; line-height:1; }
  .clock-card .cmeta { display:flex; align-items:center; gap:10px; margin-top:9px; font-size:12px; opacity:.6; }
  .clock-card .cmeta .dot { width:4px; height:4px; border-radius:50%; background:currentColor; }

  /* 焦点/统计瓷砖 */
  .focus-list { display:flex; flex-direction:column; gap:9px; }
  .focus-row { display:flex; align-items:center; gap:11px; }
  .focus-row .fic { width:30px; height:30px; border-radius:9px; display:grid; place-items:center; flex:0 0 auto;
    background:var(--surface-nested); border:1px solid var(--border); }
  .focus-row .ft { flex:1; min-width:0; cursor:pointer; }
  .focus-row .fn { font-size:13.5px; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .focus-row .fn.done { text-decoration:line-through; color:var(--text-secondary); }
  .focus-row .fm { font-size:11px; color:var(--text-secondary); margin-top:2px; }
  .focus-empty { color:var(--text-secondary); font-size:12.5px; line-height:1.7; padding:6px 0; }
  .stat-big { font-size:32px; font-weight:800; letter-spacing:-.03em; line-height:1; }
  .stat-big small { font-size:15px; color:var(--text-secondary); font-weight:700; letter-spacing:0; }
  .stat-cap { font-size:12px; color:var(--text-secondary); margin-top:7px; }
  .prog-line { height:7px; border-radius:999px; background:var(--border); overflow:hidden; margin-top:auto; }
  .prog-line i { display:block; height:100%; border-radius:999px; }

  /* 习惯追踪周网格表 */
  .habit-tb { width:100%; border-collapse:collapse; }
  .habit-tb th { font-size:10.5px; font-weight:700; color:var(--text-tertiary); padding:0 0 9px; text-align:center; }
  .habit-tb th.hh { text-align:left; }
  .habit-tb th.hr { text-align:right; }
  .habit-tb td { padding:5px 0; text-align:center; vertical-align:middle; }
  .habit-tb td.hn { text-align:left; font-size:12.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:118px; }
  .habit-tb td.hn .hdot { display:inline-block; width:7px; height:7px; border-radius:50%; margin-right:7px; vertical-align:middle; }
  .habit-tb td.hrate { text-align:right; font-size:12.5px; font-weight:800; letter-spacing:-.02em; }
  .hcell { display:inline-grid; place-items:center; width:22px; height:22px; border-radius:7px; color:var(--on-accent); cursor:pointer; transition:transform .12s; }
  .hcell:hover { transform:scale(1.12); }
  .hcell.on { background:var(--module-1); }
  .hcell.off { background:var(--surface-nested); border:1px solid var(--border); }
  .hcell svg { opacity:0; } .hcell.on svg { opacity:1; }
  .habit-tb .tdcol { background:var(--accent-muted); }
  .habit-tb col.todaycol { background:var(--accent-muted); }

  /* 待办清单（仪表盘式） */
  .tk-head { display:flex; align-items:center; gap:10px; margin-bottom:8px; }
  .tk-head .pct { font-size:22px; font-weight:800; letter-spacing:-.03em; }
  .tk-head .cnt { font-size:12px; color:var(--text-secondary); font-weight:700; }
  .tk-head .bar { flex:1; height:6px; border-radius:999px; background:var(--border); overflow:hidden; }
  .tk-head .bar i { display:block; height:100%; border-radius:999px; background:var(--accent); }
  .tk-list { display:flex; flex-direction:column; }
  .tk-row { display:flex; align-items:center; gap:11px; padding:8px 0; border-bottom:1px solid var(--border); }
  .tk-row:last-child { border-bottom:none; }
  .tk-chk { flex:0 0 auto; width:20px; height:20px; border-radius:6px; border:1.6px solid var(--border-input);
    display:grid; place-items:center; cursor:pointer; background:var(--surface-card); color:var(--on-accent); transition:all .15s; }
  .tk-chk.on { background:var(--module-1); border-color:var(--module-1); }
  .tk-chk svg { opacity:0; } .tk-chk.on svg { opacity:1; }
  .tk-name { flex:1; min-width:0; font-size:13.5px; font-weight:600; cursor:pointer; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .tk-name.done { text-decoration:line-through; color:var(--text-secondary); }

  /* 番茄钟卡 */
  .pomo { position:relative; overflow:hidden; border-radius:var(--radius-card); text-align:center;
    background:linear-gradient(155deg,var(--drawer-bg-top),var(--drawer-bg)); color:var(--drawer-text); padding:22px 20px; box-shadow:var(--shadow-overlay);
    display:flex; flex-direction:column; }
  .pomo::before { content:""; position:absolute; width:180px; height:180px; border-radius:50%; left:50%; top:-60px; transform:translateX(-50%);
    background:radial-gradient(circle,rgba(197,93,79,.28),transparent 70%); }
  .pomo > * { position:relative; z-index:1; }
  .pomo .pen { font-size:9.5px; font-weight:800; letter-spacing:.16em; opacity:.55; }
  .pomo .pzh { font-size:13px; font-weight:800; margin-top:3px; }
  .pomo .ring-wrap { position:relative; width:150px; height:150px; margin:14px auto 12px; }
  .pomo .ring-wrap svg { transform:rotate(-90deg); }
  .pomo .ptime { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; }
  .pomo .ptime .t { font-size:32px; font-weight:800; font-variant-numeric:tabular-nums; letter-spacing:.01em; }
  .pomo .ptime .s { font-size:11px; opacity:.6; }
  .pomo .pctl { display:flex; gap:8px; justify-content:center; margin-bottom:14px; }
  .pomo .pctl button { border:1px solid var(--pomo-border); background:var(--pomo-btn-bg); color:var(--pomo-btn-text);
    border-radius:9px; padding:8px 16px; font-size:13px; font-weight:700; cursor:pointer; transition:all .15s; }
  .pomo .pctl button:hover { background:var(--pomo-btn-hover); }
  .pomo .pctl button.primary { background:var(--accent); color:var(--on-accent); border-color:var(--accent); }
  .pomo .pstats { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .pomo .pstats .ps { background:var(--pomo-stat-bg); border-radius:10px; padding:9px 4px; }
  .pomo .pstats .pv { font-size:18px; font-weight:800; letter-spacing:-.02em; color:var(--pomo-text); }
  .pomo .pstats .pl { font-size:10.5px; opacity:.55; margin-top:2px; color:var(--pomo-text); }
  .pomo .pomo-durs { display:flex; gap:6px; justify-content:center; margin:10px 0 2px; }
  .pomo .pomo-dur { border:1px solid var(--pomo-border); background:var(--pomo-btn-bg); color:var(--pomo-text-muted);
    border-radius:8px; padding:5px 12px; font-size:12px; font-weight:700; cursor:pointer; transition:all .15s; }
  .pomo .pomo-dur:hover { background:var(--pomo-btn-hover); }
  .pomo .pomo-dur.on { background:var(--accent); color:var(--on-accent); border-color:var(--accent); }
  .pomo .pomo-task { width:100%; box-sizing:border-box; margin:6px 0 12px; padding:8px 12px;
    border:1px solid var(--pomo-border); background:var(--pomo-btn-bg); color:var(--pomo-text);
    border-radius:9px; font-size:13px; font-family:inherit; outline:none; transition:border .15s; }
  .pomo .pomo-task:focus { border-color:var(--accent); }
  .pomo .pomo-task::placeholder { color:var(--pomo-text-muted); }
  .pomo .pomo-task[readonly] { opacity:.6; cursor:not-allowed; }
  /* 浅色主题番茄钟变量 — 卡片底色是深色侧栏色，所以文字用浅色 */
  :root, [data-theme="paper"], [data-theme="retro"] {
    --pomo-text: var(--drawer-text);
    --pomo-text-muted: var(--drawer-text-mute);
    --pomo-border: rgba(255,255,255,.18);
    --pomo-btn-bg: rgba(255,255,255,.08);
    --pomo-btn-hover: rgba(255,255,255,.16);
    --pomo-btn-text: var(--drawer-text);
    --pomo-stat-bg: rgba(255,255,255,.06);
    --pomo-ring-track: rgba(255,255,255,.14);
  }
  /* 暗色主题番茄钟变量 */
  [data-theme="starry"], [data-theme="crimson"] {
    --pomo-text: #eef2fb;
    --pomo-text-muted: rgba(238,242,251,.5);
    --pomo-border: rgba(255,255,255,.18);
    --pomo-btn-bg: rgba(255,255,255,.08);
    --pomo-btn-hover: rgba(255,255,255,.16);
    --pomo-btn-text: #eef2fb;
    --pomo-stat-bg: rgba(255,255,255,.06);
    --pomo-ring-track: rgba(255,255,255,.14);
  }
  /* 专注番茄独立页面 */
  .pomo-page-grid { display:grid; grid-template-columns:1fr 340px; gap:16px; margin-bottom:20px; }
  .pomo-page-grid .pomo-main { min-width:0; }
  .pomo-page-grid .pomo-side { display:flex; flex-direction:column; gap:16px; }
  @media(max-width:900px){ .pomo-page-grid{ grid-template-columns:1fr; } }
  .pomo-weekbar { display:flex; align-items:flex-end; justify-content:space-between; height:120px; padding:8px 4px 0; gap:6px; }
  .pomo-wd { display:flex; flex-direction:column; align-items:center; flex:1; gap:6px; }
  .pomo-wbar { width:100%; max-width:28px; min-height:3px; border-radius:6px 6px 2px 2px; background:linear-gradient(180deg, var(--accent), var(--module-1)); transition:height .3s ease; }
  .pomo-wlabel { font-size:11px; color:var(--text-tertiary); }
  .pomo-sessions { display:flex; flex-direction:column; gap:8px; max-height:300px; overflow-y:auto; padding-right:4px; }
  .pomo-sess { display:flex; align-items:center; gap:10px; padding:8px 10px; background:var(--surface-nested); border-radius:10px; }
  .pomo-sess .ps-min { font-size:20px; font-weight:800; color:var(--accent); min-width:36px; }
  .pomo-sess .ps-min small { font-size:12px; opacity:.6; }
  .pomo-sess .ps-task { flex:1; font-size:13px; color:var(--text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .pomo-sess .ps-date { font-size:11px; color:var(--text-tertiary); }
  .pomo-tips { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; }
  .pomo-tip { display:flex; align-items:center; gap:8px; padding:14px 16px; background:var(--surface-card); border:1px solid var(--border); border-radius:var(--radius-card); box-shadow:var(--shadow-card); font-size:13px; color:var(--text-secondary); }
  .pomo-tip .pt-num { width:24px; height:24px; border-radius:50%; background:var(--accent); color:var(--on-accent); display:grid; place-items:center; font-size:12px; font-weight:800; flex:0 0 auto; }
  @media(max-width:700px){ .pomo-tips{ grid-template-columns:1fr 1fr; } }
  .pomo-mini { transition:transform .2s, box-shadow .2s; }
  .pomo-mini:hover { transform:translateY(-2px); }
  .pomo-mini-bar { height:6px; background:var(--surface-nested); border-radius:3px; overflow:hidden; margin:10px 0 6px; }
  .pomo-mini-bar .pmb-fill { height:100%; background:linear-gradient(90deg, var(--accent), var(--module-1)); border-radius:3px; transition:width .3s ease; }
  .pomo-mini-text { font-size:12px; color:var(--text-tertiary); margin-top:2px; }
  /* 专注完成弹窗 */
  .pomo-overlay { position:fixed; inset:0; z-index:9999; background:rgba(0,0,0,.45); display:flex; align-items:center; justify-content:center; backdrop-filter:blur(4px); }
  .pomo-dialog { background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:32px 28px 24px;
    text-align:center; max-width:360px; width:90%; box-shadow:var(--shadow-overlay); animation:pomoPop .3s ease; }
  @keyframes pomoPop { from{opacity:0;transform:scale(.9)} to{opacity:1;transform:scale(1)} }
  .pomo-dialog .pd-icon { width:56px; height:56px; margin:0 auto 14px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    background:var(--module-1); color:#fff; }
  .pomo-dialog .pd-title { font-size:18px; font-weight:800; color:var(--text); margin-bottom:8px; }
  .pomo-dialog .pd-info { font-size:14px; color:var(--text-secondary); margin-bottom:4px; }
  .pomo-dialog .pd-desc { font-size:12.5px; color:var(--text-tertiary); margin-bottom:20px; }
  .pomo-dialog .pd-btns { display:flex; gap:10px; }
  .pomo-dialog .pd-skip, .pomo-dialog .pd-count { flex:1; padding:10px 16px; border-radius:10px; font-size:13px; font-weight:700; cursor:pointer; transition:all .15s; border:none; }
  .pomo-dialog .pd-skip { background:var(--surface-nested); color:var(--text-secondary); }
  .pomo-dialog .pd-skip:hover { background:var(--border); }
  .pomo-dialog .pd-count { background:var(--accent); color:#fff; }
  .pomo-dialog .pd-count:hover { opacity:.88; }

  /* 在读好书 */
  .book-list { display:flex; flex-direction:column; gap:12px; }
  .book-row { display:flex; align-items:center; gap:12px; cursor:pointer; }
  .book-row .spine { width:34px; height:46px; border-radius:5px; flex:0 0 auto; position:relative; box-shadow:var(--shadow-card);
    display:grid; place-items:center; color:var(--on-accent); }
  .book-row .spine::after { content:""; position:absolute; left:4px; top:4px; bottom:4px; width:2px; border-radius:2px; background:rgba(255,255,255,.35); }
  .book-row .bmid { flex:1; min-width:0; }
  .book-row .btt { font-size:13.5px; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .book-row .bsub { font-size:11px; color:var(--text-secondary); margin-top:3px; }
  .book-row .bbar { height:5px; border-radius:999px; background:var(--border); overflow:hidden; margin-top:7px; }
  .book-row .bbar i { display:block; height:100%; border-radius:999px; }
  .book-row .bpct { font-size:14px; font-weight:800; letter-spacing:-.02em; flex:0 0 auto; }

  /* 本周目标 / 通用目标条 */
  .goal-list { display:flex; flex-direction:column; gap:13px; }
  .goal-row .gt { display:flex; align-items:center; gap:8px; font-size:13px; font-weight:600; margin-bottom:7px; }
  .goal-row .gt .gp { margin-left:auto; font-size:12.5px; font-weight:800; color:var(--text-secondary); letter-spacing:-.02em; }
  .goal-row .gt .gdone { color:var(--module-1); display:flex; }
  .goal-row .gbar { height:7px; border-radius:999px; background:var(--border); overflow:hidden; }
  .goal-row .gbar i { display:block; height:100%; border-radius:999px; }

  /* 月度开销 */
  .spend-sum { display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; margin-bottom:14px; }
  .spend-total { font-size:26px; font-weight:800; letter-spacing:-.03em; }
  .spend-cap { font-size:11.5px; color:var(--text-secondary); }

  .hidden { display:none !important; }

  /* ============================================================
     扩展样式 — 日历视图 / 复盘 / 钉钉 / 通知 toast / 自动提取标记
     ============================================================ */

  /* ---------- 日历视图 ---------- */
  .cal-wrap { background:var(--surface-card); border:1px solid var(--border); border-radius:var(--radius-card);
    box-shadow:var(--shadow-card); padding:20px 22px; }
  .cal-head { display:flex; align-items:center; gap:14px; margin-bottom:14px; }
  .cal-head h3 { font-size:20px; font-weight:800; letter-spacing:-.02em; }
  .cal-head .nav-btn { width:34px; height:34px; border-radius:10px; border:1px solid var(--border-input);
    background:var(--surface-nested); color:var(--text); cursor:pointer; display:grid; place-items:center; transition:all .15s; }
  .cal-head .nav-btn:hover { background:var(--accent-muted); border-color:var(--accent); }
  .cal-head .today-btn { margin-left:8px; padding:8px 14px; font-size:13px; font-weight:700; cursor:pointer;
    background:var(--accent); color:var(--on-accent); border:none; border-radius:10px; }
  .cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:8px; }
  .cal-grid .dow { text-align:center; font-size:11.5px; font-weight:700; color:var(--text-tertiary);
    padding:6px 0 10px; letter-spacing:.08em; }
  .cal-cell { min-height:108px; border-radius:var(--radius-tile); border:1px solid var(--border);
    background:var(--surface-card); padding:8px 9px; cursor:pointer; transition:all .15s; display:flex; flex-direction:column; gap:5px; overflow:hidden; }
  .cal-cell:hover { border-color:var(--border-input); box-shadow:var(--shadow-card); }
  .cal-cell.other { background:var(--surface-nested); opacity:.55; }
  .cal-cell.today { border-color:var(--accent); box-shadow:0 0 0 2px var(--accent-muted); }
  .cal-cell .cd { font-size:13px; font-weight:800; color:var(--text); }
  .cal-cell.today .cd { color:var(--accent); }
  .cal-cell .cev { font-size:11px; padding:2px 6px; border-radius:6px; background:var(--surface-nested);
    color:var(--text-secondary); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; cursor:pointer; transition:all .12s; border:1px solid transparent; }
  .cal-cell .cev.todo { background:#eef3ec; color:#4a6a3f; border-color:#d6e2cf; border-left:3px solid #7a9a5e; }
  .cal-cell .cev.todo.pri-P0 { background:#fbecea; color:#a83a2c; border-color:#f0c4be; border-left-color:#c25d4f; }
  .cal-cell .cev.todo.pri-P1 { background:#f6efe6; color:#8a6228; border-color:#e8d4b8; border-left-color:#bd8a4e; }
  .cal-cell .cev.todo.pri-P2 { background:#edf1f5; color:#3a5a7c; border-color:#cfdae8; border-left-color:#5f7a99; }
  .cal-cell .cev.goal { background:#edf1f5; color:#3a5a7c; border-color:#cfdae8; border-left:3px solid #5f7a99; }
  .cal-cell .cev.checkin { background:#f6efe8; color:#8a5a3a; border-color:#e8d4c4; border-left:3px solid #a07a5a; }
  .cal-cell .cev.note { background:#f1eef4; color:#5d5180; border-color:#dcd5e6; border-left:3px solid #7a6a9a; }
  .cal-cell .cev.review { background:#f6ece9; color:#a04a3c; border-color:#e8c9c0; border-left:3px solid #c25d4f; }
  .cal-cell .cev:hover { transform:translateX(2px); }
  .cal-cell .cadd { margin-top:auto; font-size:11px; color:var(--text-tertiary); display:flex; align-items:center; gap:4px; }
  .cal-legend { display:flex; flex-wrap:wrap; gap:14px; padding:10px 14px 4px; border-top:1px solid var(--border); margin-top:4px; }

    border:1px solid var(--border); margin-bottom:8px; }

  /* ---------- 复盘模块 ---------- */
  .review-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:14px; margin-top:14px; }

    box-shadow:var(--shadow-card); padding:18px 20px; }
  .review-card h4 { font-size:14px; font-weight:800; letter-spacing:-.01em; margin-bottom:12px; display:flex; align-items:center; gap:8px; }

    pointer-events:auto; animation:toastIn .25s cubic-bezier(.2,.8,.3,1); }
  .toast.remind { border-left:4px solid var(--module-3); }
  .toast.ding { border-left:4px solid var(--module-2); }

    background:var(--surface-nested); color:var(--text); }
  .toast.remind .tic { background:var(--module-3); color:var(--on-accent); }
  .toast.ding .tic { background:var(--module-2); color:var(--on-accent); }
  .toast.auto .tic { background:var(--module-1); color:var(--on-accent); }

  .toast .tt { font-size:13.5px; font-weight:800; }
  .toast .tm { font-size:12px; color:var(--text-secondary); margin-top:3px; line-height:1.5; }
  .toast .tx { font-size:11px; color:var(--text-tertiary); margin-top:6px; display:flex; gap:8px; }

  .toast .close { color:var(--text-tertiary); cursor:pointer; background:none; border:none; padding:4px; }

  /* ---------- 自动提取标记 ---------- */
  .auto-badge { display:inline-flex; align-items:center; gap:4px; padding:2px 8px; border-radius:999px;
    font-size:10.5px; font-weight:700; background:var(--module-1); color:var(--on-accent); margin-left:6px; }
  .auto-extract-banner { background:linear-gradient(140deg,var(--module-1),#4a6a3f); color:#f4f3f0;

  .auto-extract-banner .ab-ic { width:40px; height:40px; border-radius:11px; background:rgba(244,243,240,.15); display:grid; place-items:center; flex:0 0 auto; }

  .ext-paste textarea { width:100%; min-height:140px; padding:12px; border:1px solid var(--border-input);
    border-radius:var(--radius-tile); background:var(--surface-nested); color:var(--text); font:inherit; font-size:13.5px;

  .remind-row { display:flex; gap:10px; align-items:center; }
  .remind-row .seg { flex:1; }
  .remind-row .seg .opt { flex:1; }

<script>
/* ============================================================

   支持的 type：
     todo     今日计划/待办（勾选 + 优先级）
     checkin  习惯打卡（连续天数，每天清零）
     progress 长期计划（进度条：当前/目标）
     finance  记账（收入/支出 + 分类 + 金额）
     note     内容记录/日记（标题 + 正文 + 心情标签）
   图标用 icon 字段（取自下方 ICONS 图标库，全部为单色线性图标）。
   ============================================================ */
const CONFIG = {
  storageKey: "workbench-desktop-v2",   // 换 key 可强制重置
  owner: "我的工作台",                  // 侧栏顶部标题
  slogan: "Personal Workbench",

  // 每日一句（一周七天各一句，按星期轮换：周一→周日）
  quotes: [
    "新的一周，从把最重要的一件事做好开始。",   // 周一
    "保持节奏，稳一点也没关系。",                 // 周二
    "把大目标拆小，今天只推进一步。",             // 周三
    "坚持到一半时最难，也最值得。",               // 周四
    "收个尾，给这一周一个交代。",                 // 周五
    "允许自己慢下来，好好休息也是正事。",         // 周六
    "复盘一下，为下一周留点方向。",               // 周日
  ],

  // 今日概览环形（value 为 0-100 的完成度，calc 返回 {value, sub}）
  overview: [
    { key:"todo", label:"今日待办", icon:"list", color:"var(--accent)",
      calc: d => { const it=(d.todo||[]).filter(x=>isTodoToday(x) && (!x.done || isToday(x.doneDate))); const done=it.filter(x=>x.done).length; return { value: it.length?Math.round(done/it.length*100):0, sub:`${done}/${it.length} 项` }; } },
    { key:"checkin", label:"打卡", icon:"leaf", color:"var(--module-1)",
      calc: d => { const it=d.checkin||[]; const t=today(); const done=it.filter(x=>x.log&&x.log[t]).length; return { value: it.length?Math.round(done/it.length*100):0, sub:`${done}/${it.length} 项` }; } },
    { key:"goal", label:"长期目标", icon:"target", color:"var(--module-2)", calc: d => avgProgress(d.goal) },
    { key:"notes", label:"灵感备忘", icon:"pen", color:"var(--module-5)",

  trend: {

    { label:"记灵感", icon:"pen",     module:"notes",   tint:"#f1eef4", color:"var(--module-5)" },
    { label:"记目标", icon:"target",  module:"goal",    tint:"#edf1f5", color:"var(--module-2)" },
  ],

  // ============ 模块定义 ============
  modules: [
    { key:"todo", name:"待办清单", icon:"list", tint:"#efeee8", color:"var(--accent)", type:"todo", desc:"任务清单 · 优先级 · 提醒 · 自动提取",

             {id:12,title:"完成日报与明日计划",priority:"P1",done:false,note:"",remindAt:"",auto:false},

    { key:"checkin", name:"习惯打卡", icon:"leaf", tint:"#eef3ec", color:"var(--module-1)", type:"checkin", desc:"每日打卡 · 连续天数 · 自动统计",
      seed:[ {id:21,title:"喝够 8 杯水",log:{}}, {id:22,title:"23:30 前睡觉",log:{}}, {id:23,title:"晨间冥想 5 分钟",log:{}}, {id:24,title:"每日阅读 30 分钟",log:{}} ] },
    { key:"goal", name:"长期目标", icon:"target", tint:"#edf1f5", color:"var(--module-2)", type:"progress", unit:"步", desc:"拆解目标 · 逐步推进 · 进度可视化",
      seed:[ {id:31,title:"读完《认知觉醒》",current:42,target:300,unit:"页",note:"每周推进 30 页，周末复盘"},

             {id:33,title:"背完英语核心词 1500 个",current:280,target:1500,unit:"个",note:"每天 20 个，周末复习"} ] },
    { key:"notes", name:"灵感备忘", icon:"pen", tint:"#f1eef4", color:"var(--module-5)", type:"note", desc:"随手记 · 自动提取任务 · 保存即识别",
      moods:["灵感","想法","会议","纪要","待办候选"],

  ],

/* 本周（周一起）7 天的 ISO 日期 */
function weekDates(){
  const n=new Date(); const dow=(n.getDay()+6)%7; const mon=new Date(n); mon.setDate(n.getDate()-dow);
  const arr=[]; for(let i=0;i<7;i++){ const d=new Date(mon); d.setDate(mon.getDate()+i); arr.push(d.toISOString().slice(0,10)); }
  return arr;
}
function weekNum(){ const n=new Date(); const s=new Date(n.getFullYear(),0,1);
  return Math.ceil(((n-s)/86400000 + s.getDay()+1)/7); }

/* 秒级心跳：更新时钟；番茄钟运行时倒计时 */
function startClock(){ if(clockTimer) return; clockTimer=setInterval(heartbeat,1000); heartbeat(); }
function heartbeat(){
  const el=$("#clk"); if(el){ const n=new Date(); el.textContent=`${pad2(n.getHours())}:${pad2(n.getMinutes())}:${pad2(n.getSeconds())}`; }
  if(pomo.running){ pomo.remain--; pomo.elapsed++; if(pomo.remain<=0) completePomo(); pomoUpdate(); }
}
function pomoUpdate(){
  const t=$("#pomo-time"); if(t){ t.textContent=`${pad2(Math.floor(pomo.remain/60))}:${pad2(pomo.remain%60)}`; }
  const fg=$("#pomo-fg"); if(fg){ const r=64,c=2*Math.PI*r; fg.style.strokeDashoffset=c*(1-pomo.remain/pomo.total); }
  const st=$("#pomo-status"); if(st) st.textContent=pomo.running?"专注中":"准备开始";
  const b=$("#pomo-toggle"); if(b) b.textContent=pomo.running?"暂停":"开始";
  const taskIn=$("#pomo-task"); if(taskIn && document.activeElement!==taskIn) taskIn.value=pomo.task;
}
function pomoSetDuration(min){
  if(pomo.running) return;
  pomo.total=min*60; pomo.remain=min*60; pomo.elapsed=0;
  document.querySelectorAll(".pomo-dur").forEach(b=>b.classList.toggle("on",+b.dataset.min===min));
  pomoUpdate();
}
function completePomo(){
  pomo.running=false;
  const mins=Math.round(pomo.total/60);
  const elapsedMins=Math.round(pomo.elapsed/60);
  const task=pomo.task||"专注";
  // 弹出完成确认框，让用户选择是否计入
  showPomoCompleteDialog(elapsedMins, task);
}
function showPomoCompleteDialog(mins, task){
  const ov=document.createElement("div");
  ov.className="pomo-overlay";
  ov.innerHTML=`<div class="pomo-dialog">
    <div class="pd-icon">${icon("check",32,3)}</div>
    <div class="pd-title">专注完成！</div>
    <div class="pd-info">刚刚专注 <b>${mins}</b> 分钟${task?` · ${esc(task)}`:''}</div>
    <div class="pd-desc">是否将本次专注计入今日统计？</div>
    <div class="pd-btns">
      <button class="pd-skip">没有真的专注</button>
      <button class="pd-count">计入专注</button>
    </div></div>`;
  document.body.appendChild(ov);
  ov.querySelector(".pd-count").onclick=()=>{
    data.__pomo=data.__pomo||{count:0,min:0,sessions:[]};
    data.__pomo.count++; data.__pomo.min+=mins;
    data.__pomo.sessions=data.__pomo.sessions||[];
    data.__pomo.sessions.push({date:isoToday(),mins,task,ts:Date.now()});
    store.save();
    ov.remove();
    pomo.remain=pomo.total; pomo.elapsed=0; pomo.task="";
    render();
  };
  ov.querySelector(".pd-skip").onclick=()=>{
    ov.remove();
    pomo.remain=pomo.total; pomo.elapsed=0; pomo.task="";
    pomoUpdate();
  };
  ov.onclick=e=>{ if(e.target===ov){ ov.remove(); pomo.remain=pomo.total; pomo.elapsed=0; pomoUpdate(); } };
}

/* ---------- ring svg ---------- */
function ringSVG(pct, color){
  const r=25, c=2*Math.PI*r, off=c*(1-Math.min(100,pct)/100);
  return `<svg class="gauge" viewBox="0 0 60 60"><circle cx="30" cy="30" r="${r}" fill="none" stroke="var(--border)" stroke-width="5.5"/>
    <circle cx="30" cy="30" r="${r}" fill="none" stroke="${color}" stroke-width="5.5" stroke-linecap="round"
      stroke-dasharray="${c}" stroke-dashoffset="${off}"/></svg>`;
}
function trendSVG(series){
  const w=560, h=170, padX=12, padTop=16, padBot=22;
  const max=Math.max(...series), min=Math.min(...series);
  const rng=(max-min)||1;
  const innerW=w-2*padX, innerH=h-padTop-padBot;
  const pts=series.map((v,i)=>{
    const x=padX+innerW*i/(series.length-1);
    const y=padTop+innerH*(1-(v-min)/rng);
    return [x,y];
  });
  const line=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const area=line+` L ${padX+innerW} ${h-padBot} L ${padX} ${h-padBot} Z`;
  const dots=pts.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3.2" fill="var(--surface-card)" stroke="var(--module-2)" stroke-width="2"/>`).join('');
  return `<svg class="trend-svg" viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid meet">
    <defs><linearGradient id="tg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--module-2)" stop-opacity=".22"/><stop offset="1" stop-color="var(--module-2)" stop-opacity="0"/></linearGradient></defs>
    <path d="${area}" fill="url(#tg)"/><path d="${line}" fill="none" stroke="var(--module-2)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>${dots}</svg>`;
}

/* 今日/未来提醒：todo 中带 remindAt 且未完成的项 */
function remindTileHTML(){
  const all=(data.todo||[]).filter(x=>!x.done && x.remindAt).map(x=>{
    const t=getEffectiveRemindAt(x); return { x, ts: t?t.getTime():0 };
  }).sort((a,b)=>a.ts-b.ts);
  const now = Date.now();
  const rows = all.length ? all.slice(0,4).map(({x,ts})=>{
    const due = ts - now; let label = "";
    const isWeekly = x.repeat==="weekly";
    if(due < 0 && !isWeekly) label = "已超时";
    else if(due < 3600000) label = `${Math.ceil(due/60000)} 分钟后`;
    else if(due < 86400000) label = `${Math.floor(due/3600000)} 小时后`;
    else label = isWeekly ? "每周"+fmtTime(new Date(ts).toISOString()).slice(0,5) : fmtTime(new Date(ts).toISOString()).slice(0,5);
    const overdue = due < 0 && !isWeekly;
    return `<div class="book-row js-pin-open" data-mkey="todo" data-id="${x.id}">
      <span class="spine" style="background:${overdue?'var(--danger)':'var(--module-3)'}">${icon("bell",16)}</span>
      <div class="bmid"><div class="btt">${esc(x.title)}</div><div class="bsub" style="color:${overdue?'var(--danger)':'var(--text-secondary)'}">${label} · ${x.priority||"P1"}${isWeekly?' · 每周重复':''}</div></div>
      <span class="bpct" style="color:${overdue?'var(--danger)':'var(--module-3)'}">${overdue?'!':'⏰'}</span></div>`;
  }).join("") : `<div class="focus-empty">暂无提醒。在待办里设置「提醒时间」后，到点会自动通知。</div>`;
  const pending = (data.__pendingAuto||[]).length;
  return `<div class="tile b4"><div class="tile-h"><span class="tic">${icon("bell",16)}</span><div class="tt"><span class="en">UPCOMING REMINDERS</span><span class="zh">待办提醒</span></div><span class="r js-open" data-open="calendar">日历</span></div>
    <div class="spend-sum"><span class="spend-total">${all.length}</span><span class="spend-cap">条待提醒${pending?` · ${pending} 条待确认`:''}</span></div>
    <div class="book-list">${rows}</div></div>`;
}

function wireHome(){
  $("#screen").querySelectorAll("[data-open]").forEach(el=>el.onclick=()=>go(el.dataset.open));
  $("#screen").querySelectorAll("[data-quick]").forEach(el=>el.onclick=()=>{ go(el.dataset.quick); openEditor(el.dataset.quick,null); });
  $("#screen").querySelectorAll("[data-go]").forEach(el=>el.onclick=()=>go(el.dataset.go));
  const find=el=>(data[el.dataset.mkey]||[]).find(i=>i.id==el.dataset.id);
  // 就地打卡 / 完成
  $("#screen").querySelectorAll(".js-pin-chk").forEach(el=>el.onclick=e=>{
    e.stopPropagation(); const m=modOf(el.dataset.mkey), x=find(el); if(!x) return;
    if(m.type==="todo"){ x.done=!x.done; x.doneDate = x.done ? isoToday() : ""; }
    else if(m.type==="checkin"){ x.log=x.log||{}; const t=today(); x.log[t]?delete x.log[t]:x.log[t]=true; }
    persist();
  });
  $("#screen").querySelectorAll(".js-pin-inc").forEach(el=>el.onclick=e=>{ e.stopPropagation(); const x=find(el); if(!x) return; x.current=(+x.current||0)+1; persist(); });
  $("#screen").querySelectorAll(".js-pin-dec").forEach(el=>el.onclick=e=>{ e.stopPropagation(); const x=find(el); if(!x) return; x.current=Math.max(0,(+x.current||0)-1); persist(); });
  $("#screen").querySelectorAll(".js-pin-open").forEach(el=>el.onclick=e=>{ e.stopPropagation(); openEditor(el.dataset.mkey, find(el)); });
  // 习惯追踪表：点方框直接给对应日期打卡 / 取消
  $("#screen").querySelectorAll(".js-habit").forEach(el=>el.onclick=e=>{
    e.stopPropagation(); const x=(data.checkin||[]).find(i=>i.id==el.dataset.id); if(!x) return;
    const d=el.dataset.day; x.log=x.log||{}; x.log[d]?delete x.log[d]:x.log[d]=true; persist();
  });
  // 番茄钟控制
  const tg=$("#pomo-toggle"); if(tg) tg.onclick=()=>{ pomo.running=!pomo.running; pomoUpdate(); };
  const rs=$("#pomo-reset"); if(rs) rs.onclick=()=>{ pomo.running=false; pomo.remain=pomo.total; pomo.elapsed=0; pomoUpdate(); };
  document.querySelectorAll(".pomo-dur").forEach(b=>b.onclick=()=>pomoSetDuration(+b.dataset.min));
  const taskIn=$("#pomo-task"); if(taskIn) taskIn.oninput=()=>{ pomo.task=taskIn.value; };
}
