/* ---------- MODULE VIEW ---------- */
function renderModule(key){
  const m=modOf(key); const all=data[key]||[]; let it=all;
  const t=today();
  const q=searchQ.trim().toLowerCase();
  if(q) it=all.filter(x=>(x.title||"").toLowerCase().includes(q)||(x.note||x.content||"").toLowerCase().includes(q));

  let head="";
  if(m.type==="finance"){
    const inc=all.filter(x=>x.type==="income").reduce((a,x)=>a+ +x.amount,0);
    const exp=all.filter(x=>x.type==="expense").reduce((a,x)=>a+ +x.amount,0);
    head=`<div class="mod-summary">
      <div class="mini"><div class="l">收入</div><div class="v" style="color:var(--module-1)">¥${inc}</div></div>
      <div class="mini"><div class="l">支出</div><div class="v" style="color:var(--danger)">¥${exp}</div></div>
      <div class="mini"><div class="l">结余</div><div class="v">¥${inc-exp}</div></div>
      <div class="mini"><div class="l">笔数</div><div class="v">${all.length}</div></div></div>`;
  } else if(m.type==="todo"){
    const todayIt=all.filter(x=>isTodoToday(x));
    const done=todayIt.filter(x=>x.done).length;
    head=headHero(m, `${done}/${todayIt.length}`, `今日已完成 · 共 ${all.length} 条`);
  } else if(m.type==="checkin"){
    const done=all.filter(x=>x.log&&x.log[t]).length;
    head=headHero(m, `${done}/${all.length}`, "今日已打卡");
  } else if(m.type==="progress"){
    const p=avgProgress(all);
    head=headHero(m, `${p.value}%`, `平均进度 · ${all.length} 项`);
  } else if(m.type==="note"){
    const todayN=all.filter(x=>x.date===t).length;
    head=headHero(m, `${all.length}`, `条记录 · 今日 ${todayN} 条`, null);
  }

  // 待办排序
  if(m.type==="todo"){
    const arr=[...it];
    if(todoSort==="time") arr.sort((a,b)=>{ const ta=a.remindAt?new Date(a.remindAt).getTime():Infinity; const tb=b.remindAt?new Date(b.remindAt).getTime():Infinity; return ta-tb; });
    else if(todoSort==="importance") arr.sort((a,b)=>(b.importance||3)-(a.importance||3));
    else if(todoSort==="urgency") arr.sort((a,b)=>(b.urgency||3)-(a.urgency||3));
    else if(todoSort==="score") arr.sort((a,b)=>((b.importance||3)*(b.urgency||3))-((a.importance||3)*(a.urgency||3)));
    it=arr;
  }

  const body = it.length ? it.map(x=>recHTML(m,x)).join("")
    : `<div class="empty"><span class="e">${icon(m.icon,28)}</span><div>${q?'没有匹配的记录':'还没有记录，点右上角「新建」添加第一条吧'}</div></div>`;

  // 待办控件：排序 + 视图切换
  let todoCtrls="";
  if(m.type==="todo"){
    const sortOpts=[{k:"default",l:"默认"},{k:"time",l:"按时间"},{k:"importance",l:"按重要性"},{k:"urgency",l:"按紧急度"},{k:"score",l:"按综合分"}];
    todoCtrls=`<div class="todo-ctrls">
      <div class="seg mini-seg" id="sort-seg">${sortOpts.map(o=>`<div class="opt ${todoSort===o.k?'on':''}" data-v="${o.k}">${o.l}</div>`).join("")}</div>

        <div class="opt ${todoView==='quadrant'?'on':''}" data-v="quadrant">${icon("grid",14)} 四象限</div>
      </div>
    </div>`;
  }

  if(key==="notes"){
    todoCtrls=`<div class="seg mini-seg" id="notes-view-seg">
      <div class="opt ${notesView==='book'?'on':''}" data-v="book">${icon("book",14)} 手帐</div>
      <div class="opt ${notesView==='list'?'on':''}" data-v="list">${icon("list",14)} 列表</div>
    </div>`;
  }

  // 四象限视图 / 手帐书本视图 / 游戏化习惯
  let mainBody="";

    mainBody = renderQuadrantView(it);

    mainBody = renderNotesBook(it);

    mainBody = `<div class="sec-title">全部记录 <span id="rec-count" style="margin-left:auto;font-weight:500;color:var(--text-secondary);font-size:12px">${it.length} 条</span></div>
        <div class="rec-grid">${body}</div>`;
  }

  $("#screen").innerHTML=`<div class="header"><div><h2>${m.name}</h2><p>${m.desc}</p></div><div class="spacer"></div><span class="date-chip">${icon("calendar",14)} ${dateStr()}</span></div>
    <div class="toolbar">
      <div class="search-box">${icon("search",15,2.2)}<input id="search" placeholder="搜索…" value="${attr(searchQ)}"/></div>
      ${todoCtrls}
      <div class="spacer"></div><button class="btn" id="btn-new">${icon("plus",16,2.2)}新建</button></div>
    ${head}
    <div class="mod-layout">
      <div class="mod-main">
        ${mainBody}
      </div>
      <aside class="mod-side">${sideStats(m,all)}</aside>
    </div>`;
  const s=$("#search");
  let composing=false;
  const refresh=()=>{ searchQ=s.value; renderModuleResults(key); };
  s.addEventListener("compositionstart",()=>{ composing=true; });
  s.addEventListener("compositionend",()=>{ composing=false; refresh(); });
  s.addEventListener("input",()=>{ if(!composing) refresh(); });
  $("#btn-new").onclick=()=>openEditor(key,null);
  // 待办排序 + 视图切换
  const sortSeg=$("#sort-seg"); if(sortSeg) sortSeg.querySelectorAll(".opt").forEach(o=>o.onclick=()=>{ todoSort=o.dataset.v; localStorage.setItem("__todoSort",todoSort); renderModule(key); });
  const viewSeg=$("#view-seg"); if(viewSeg) viewSeg.querySelectorAll(".opt").forEach(o=>o.onclick=()=>{ todoView=o.dataset.v; localStorage.setItem("__todoView",todoView); renderModule(key); });
  const notesViewSeg=$("#notes-view-seg"); if(notesViewSeg) notesViewSeg.querySelectorAll(".opt").forEach(o=>o.onclick=()=>{ notesView=o.dataset.v; localStorage.setItem("__notesView",notesView); renderModule(key); });
  wireModule(key);
}

/* 仅刷新受搜索影响的记录列表与计数，不重建搜索框（避免打断中文输入法） */
function renderModuleResults(key){
  const m=modOf(key); const all=data[key]||[];
  const q=searchQ.trim().toLowerCase();
  const it=q?all.filter(x=>(x.title||"").toLowerCase().includes(q)||(x.note||x.content||"").toLowerCase().includes(q)):all;
  /* 游戏化打卡视图搜索刷新 */
  const hg=$(".habit-game");
  if(hg && m.type==="checkin"){
    hg.outerHTML = renderCheckinGame(it);
    wireModule(key);
    return;
  }
  const grid=$(".rec-grid");
  if(grid){
    const body = it.length ? it.map(x=>recHTML(m,x)).join("")
      : `<div class="empty"><span class="e">${icon(m.icon,28)}</span><div>${q?'没有匹配的记录':'还没有记录，点右上角「新建」添加第一条吧'}</div></div>`;
    grid.innerHTML=body;
  }
  const bookPages=$(".book-pages");
  if(bookPages && key==="notes"){
    bookPages.innerHTML = it.length ? it.map(x=>{
      const body=(x.content||"").trim();
      return `<div class="note-page" data-edit="${x.id}">
        <div class="np-head"><span class="np-title">${esc(x.title||'无标题')}</span>${x.mood?`<span class="np-mood">${esc(x.mood)}</span>`:''}</div>
        <div class="np-body">${body?esc(body):'<span style="color:var(--text-tertiary)">（无内容）</span>'}</div>
        <div class="np-foot"><span>${x.date||''}</span><span class="np-acts">
          <button class="pin-btn js-pin ${x.pinned?'on':''}" data-id="${x.id}" title="置顶" onclick="event.stopPropagation()">${icon("star",14)}</button>
          <button class="del js-del" data-id="${x.id}" title="删除" onclick="event.stopPropagation()">${icon("trash",14)}</button>
        </span></div></div>`;
    }).join("") : `<div class="book-empty">${icon("pen",28)}<div style="margin-top:10px">${q?'没有匹配的记录':'还没有灵感'}</div></div>`;
  }
  const cnt=$("#rec-count"); if(cnt) cnt.textContent=`${it.length} 条`;
  wireModule(key);
}

/* 模块统计侧栏：按 type 生成多维数据，填满右侧空间 */
function sideStats(m, all){
  const t=today();
  const palette=["var(--accent)","var(--module-1)","var(--module-2)","var(--module-3)","var(--module-4)","var(--module-5)","var(--danger)"];
  const row=(k,v,dot)=>`<div class="stat-row"><span class="k">${dot?`<span class="kd" style="background:${dot}"></span>`:''}${k}</span><span class="val">${v}</span></div>`;

  if(m.type==="finance"){
    const inc=all.filter(x=>x.type==="income").reduce((a,x)=>a+ +x.amount,0);
    const exp=all.filter(x=>x.type==="expense").reduce((a,x)=>a+ +x.amount,0);
    // 支出按分类聚合
    const byCat={}; all.filter(x=>x.type==="expense").forEach(x=>{ const c=x.category||"其他"; byCat[c]=(byCat[c]||0)+ +x.amount; });
    const cats=Object.entries(byCat).sort((a,b)=>b[1]-a[1]);
    const maxC=cats.length?cats[0][1]:1;
    const catBars=cats.length? cats.map((c,i)=>`<div class="cbrow"><span class="cbn">${esc(c[0])}</span><span class="cbt"><i style="width:${Math.round(c[1]/maxC*100)}%;background:${palette[i%palette.length]}"></i></span><span class="cbv">¥${c[1]}</span></div>`).join("")
      : `<div style="color:var(--text-tertiary);font-size:12.5px;padding:6px 0">暂无支出记录</div>`;
    const todayExp=all.filter(x=>x.type==="expense"&&x.date===t).reduce((a,x)=>a+ +x.amount,0);
    return `<div class="side-card"><div class="sh">${icon("wallet",15)} 收支概况</div>
        ${row("总收入",`<span style="color:var(--module-1)">¥${inc}</span>`)}
        ${row("总支出",`<span style="color:var(--danger)">¥${exp}</span>`)}
        ${row("净结余",`¥${inc-exp}`)}
        ${row("今日支出",`¥${todayExp}`)}
        ${row("总笔数",`${all.length} 笔`)}</div>
      <div class="side-card"><div class="sh">${icon("chart",15)} 支出分类占比</div><div class="catbar">${catBars}</div></div>`;
  }

  if(m.type==="progress"){
    const p=avgProgress(all);
    const doneN=all.filter(x=>((x.current/x.target)*100||0)>=100).length;
    const totalCur=all.reduce((a,x)=>a+ (+x.current||0),0);
    const totalTgt=all.reduce((a,x)=>a+ (+x.target||0),0);
    return `<div class="side-card"><div class="sh">${icon("target",15)} 总体进度</div>
        <div class="side-ring"><div class="dial">${ringSVG(p.value,m.color)}<span class="mid"><span class="big" style="color:${m.color}">${p.value}%</span><span class="cap">平均进度</span></span></div></div></div>
      <div class="side-card"><div class="sh">${icon("list",15)} 数据统计</div>
        ${row("进行项目",`${all.length} 项`)}
        ${row("已达成",`${doneN} 项`)}
        ${row("累计完成",`${totalCur} ${all[0]?.unit||m.unit||''}`)}
        ${row("总目标量",`${totalTgt} ${all[0]?.unit||m.unit||''}`)}</div>`;
  }

  if(m.type==="checkin"){
    const done=all.filter(x=>x.log&&x.log[t]).length; const pct=all.length?Math.round(done/all.length*100):0;
    const streaks=all.map(x=>({title:x.title,s:streak(x.log),total:totalCheckinDays(x.log)})).sort((a,b)=>b.s-a.s);
    const best=streaks[0]?streaks[0].s:0;
    const totalAll=all.reduce((a,x)=>a+totalCheckinDays(x.log),0);
    const hi=habitLevel(totalAll);
    const list=streaks.slice(0,6).map(x=>`<div class="stat-row"><span class="k">${esc(x.title)}</span><span class="val" style="color:${habitLevel(x.total).cur.color}">Lv.${habitLevel(x.total).lv} · ${x.s}天</span></div>`).join("");
    return `<div class="side-card"><div class="sh">${icon("leaf",15)} 今日打卡</div>
        <div class="side-ring"><div class="dial">${ringSVG(pct,m.color)}<span class="mid"><span class="big" style="color:${m.color}">${done}/${all.length}</span><span class="cap">已完成</span></span></div></div></div>
      <div class="side-card"><div class="sh">${icon("flame",15)} 习惯等级</div>
        ${row("总等级",`<span style="color:${hi.cur.color}">Lv.${hi.lv} ${hi.cur.name}</span>`)}
        ${row("累计打卡",`${totalAll} 天`)}
        ${row("最长连续",`<span style="color:var(--module-3)">${best} 天</span>`)}
        ${row("习惯总数",`${all.length} 个`)}
        <div style="margin-top:6px">${list}</div></div>`;
  }

  if(m.type==="todo"){
    const done=all.filter(x=>x.done).length; const pct=all.length?Math.round(done/all.length*100):0;
    const byP={}; (m.priorities||[]).forEach(p=>byP[p.key]=0); all.forEach(x=>{ if(byP[x.priority]!=null) byP[x.priority]++; });
    const pRows=(m.priorities||[]).map(p=>`<div class="stat-row"><span class="k"><span class="kd" style="background:${p.text}"></span>${p.label}</span><span class="val">${byP[p.key]||0} 项</span></div>`).join("");
    return `<div class="side-card"><div class="sh">${icon("list",15)} 完成情况</div>
        <div class="side-ring"><div class="dial">${ringSVG(pct,m.color)}<span class="mid"><span class="big" style="color:${m.color}">${pct}%</span><span class="cap">${done}/${all.length} 完成</span></span></div></div></div>
      <div class="side-card"><div class="sh">${icon("chart",15)} 优先级分布</div>
        ${pRows}
        ${row("剩余待办",`${all.length-done} 项`)}</div>`;
  }

  // note
  const todayN=all.filter(x=>x.date===t).length;
  const byMood={}; all.forEach(x=>{ const md=x.mood||"未分类"; byMood[md]=(byMood[md]||0)+1; });
  const moods=Object.entries(byMood).sort((a,b)=>b[1]-a[1]);
  const maxM=moods.length?moods[0][1]:1;
  const moodBars=moods.length? moods.map((c,i)=>`<div class="cbrow"><span class="cbn">${esc(c[0])}</span><span class="cbt"><i style="width:${Math.round(c[1]/maxM*100)}%;background:${palette[i%palette.length]}"></i></span><span class="cbv">${c[1]} 条</span></div>`).join("")
    : `<div style="color:var(--text-tertiary);font-size:12.5px;padding:6px 0">暂无记录</div>`;
  return `<div class="side-card"><div class="sh">${icon("pen",15)} 记录统计</div>
      ${row("累计记录",`${all.length} 条`)}
      ${row("今日新增",`${todayN} 条`)}
      ${row("标签种类",`${moods.length} 种`)}</div>
    <div class="side-card"><div class="sh">${icon("chart",15)} 标签分布</div><div class="catbar">${moodBars}</div></div>`;
}

/* 四象限视图：重要度(X→) × 紧急度(Y↑) */
function renderQuadrantView(items){
  const qs={q1:[],q2:[],q3:[],q4:[]};
  items.forEach(x=>{
    const imp=x.importance||3, urg=x.urgency||3;
    const q = imp>=3&&urg>=3?'q1':imp>=3&&urg<3?'q2':imp<3&&urg>=3?'q3':'q4';
    qs[q].push(x);
  });
  const qCard=(q,label,color)=>`<div class="q-col" data-q="${q}">
    <div class="q-head" style="border-left-color:${color}"><span class="qh-l">${label}</span><span class="qh-n">${qs[q].length}</span></div>
    <div class="q-items">${qs[q].length?qs[q].map(x=>{
      const urg=x.urgency&&remindUrgency(x.remindAt,x.repeat)?remindUrgency(x.remindAt,x.repeat):null;
      return `<div class="q-item ${x.done?'done':''}" draggable="true" data-edit="${x.id}" data-id="${x.id}">
        <div class="qi-chk js-chk ${x.done?'on':''}" data-id="${x.id}">${x.done?icon("check",11,2):''}</div>
        <div class="qi-body"><div class="qi-t">${esc(x.title)}</div>
          ${x.remindAt?`<div class="qi-r">${icon("bell",10)} ${x.repeat==="weekly"?(remindUrgency(x.remindAt,x.repeat)?.label||fmtTime(x.remindAt)):fmtTime(x.remindAt)}</div>`:''}</div>
        <div class="qi-iu" title="重要${x.importance||3}/紧急${x.urgency||3}">I${x.importance||3}·U${x.urgency||3}</div>
      </div>`;
    }).join(""):`<div class="q-empty">暂无</div>`}</div>
    <div class="q-drop-hint">拖到此处</div>
  </div>`;
  return `<div class="quad-view">
    <div class="quad-axis-y">↑ 紧急</div>
    <div class="quad-axis-x">重要 →</div>
    <div class="quad-grid">
      ${qCard('q3','Q3 · 不重要紧急','#bd8a4e')}
      ${qCard('q1','Q1 · 重要紧急','#c25d4f')}
      ${qCard('q4','Q4 · 不重要不紧急','#9a958a')}
      ${qCard('q2','Q2 · 重要不紧急','#5f7a99')}
    </div>
  </div>`;
}

/* ===== 游戏化习惯打卡 ===== */
const HABIT_LEVELS=[
  {min:0,  name:"初心者", color:"#5b8c5a", tint:"#e8f3e8"},
  {min:7,  name:"坚持者", color:"#3a9b8a", tint:"#e2f4f0"},
  {min:14, name:"习惯客", color:"#4a7cc4", tint:"#e8eff8"},
  {min:30, name:"自律者", color:"#8a5fb8", tint:"#f0e8f8"},
  {min:60, name:"毅力家", color:"#d67830", tint:"#f8ede0"},
  {min:100,name:"年度王", color:"#c9a227", tint:"#f8f0dc"},
  {min:200,name:"传奇者", color:"#2a9db8", tint:"#dcf0f5"},
  {min:365,name:"不朽者", color:"#b8405a", tint:"#f5dce2"},
];
const HABIT_REWARDS=[
  {days:1,   name:"首日打卡",     icon:"sparkles"},
  {days:3,   name:"三日坚持",     icon:"leaf"},
  {days:7,   name:"一周连胜",     icon:"flame"},
  {days:14,  name:"半月达成",     icon:"star"},
  {days:21,  name:"习惯养成",     icon:"target"},
  {days:30,  name:"月度之星",     icon:"award"},
  {days:50,  name:"毅力钻石",     icon:"gem"},
  {days:100, name:"百日战神",     icon:"crown"},
  {days:200, name:"双百传奇",     icon:"trophy"},
  {days:365, name:"不朽之环",     icon:"diamond"},
];
function habitLevel(total){
  let lv=HABIT_LEVELS[0];
  for(const l of HABIT_LEVELS){ if(total>=l.min) lv=l; }
  const idx=HABIT_LEVELS.indexOf(lv);
  const next=HABIT_LEVELS[idx+1];
  return {cur:lv, lv:idx+1, next, progress: next?Math.round((total-lv.min)/(next.min-lv.min)*100):100};
}
function totalCheckinDays(log){ return log?Object.keys(log).filter(k=>log[k]).length:0; }
function nextReward(total){
  for(const r of HABIT_REWARDS){ if(total<r.days) return r; }
  return null;
}
function lastReward(total){
  let r=null;
  for(const x of HABIT_REWARDS){ if(total>=x.days) r=x; }
  return r;
}
function renderCheckinGame(items){
  const wk=weekDates(); const t=today(); const tIdx=wk.indexOf(t);
  const dnames=["一","二","三","四","五","六","日"];
  const colors=["#5b8c5a","#3a9b8a","#4a7cc4","#8a5fb8","#d67830","#c9a227","#2a9db8","#b8405a"];
  if(!items.length) return `<div class="empty"><span class="e">${icon("leaf",28)}</span><div>还没有习惯，点右上角「新建」添加第一个吧</div></div>`;
  return `<div class="habit-game">${items.map((x,i)=>{
    const on=!!(x.log&&x.log[t]);
    const st=streak(x.log);
    const total=totalCheckinDays(x.log);
    const hi=habitLevel(total);
    const color=hi.cur.color;
    const tint=hi.cur.tint;
    const rw=nextReward(total);
    const lastRw=lastReward(total);
    const wkDots=wk.map((day,idx)=>{
      const done=!!(x.log&&x.log[day]);
      return `<div class="hc-wd"><div class="dot ${done?'on':''} ${idx===tIdx?'today':''}">${done?icon("check",11,2):''}</div><span class="lbl">${dnames[idx]}</span></div>`;
    }).join("");
    const ringPct=on?100:Math.min(st*14,100);
    const ringR=26, ringC=2*Math.PI*ringR;
    const ringOff=ringC*(1-ringPct/100);
    return `<div class="hc-card ${on?'done':''}" style="--hc-color:${color};--hc-tint:${tint}" data-edit="${x.id}">
      <div class="hc-top">
        <div class="hc-name"><div class="hc-check js-habit-chk ${on?'on':''}" data-id="${x.id}">${on?icon("check",14,2):''}</div>${esc(x.title)}</div>
        <span class="hc-lv-badge">Lv.${hi.lv} ${hi.cur.name}</span>
      </div>
      <div class="hc-body">
        <div class="hc-ring-wrap">
          <svg width="64" height="64" viewBox="0 0 64 64">
            <circle cx="32" cy="32" r="${ringR}" fill="none" stroke="var(--surface-nested)" stroke-width="5"/>
            <circle cx="32" cy="32" r="${ringR}" fill="none" stroke="${color}" stroke-width="5"
              stroke-dasharray="${ringC}" stroke-dashoffset="${ringOff}" stroke-linecap="round"/>
          </svg>
          <div class="hc-ring-mid"><div style="text-align:center">
            <div class="hc-ring-num" style="color:${color}">${on?'完成':st+'天'}</div>
            <div class="hc-ring-cap">${on?'已打卡':'连续'}</div>
          </div></div>
        </div>
        <div class="hc-stats">
          <div class="hc-streak">${icon("flame",15)} 连续 ${st} 天 ${on?'<span style="font-size:11px;color:'+color+';margin-left:4px">今日已完成</span>':''}</div>
          <div class="hc-total">累计打卡 ${total} 天 · Lv.${hi.lv} ${hi.cur.name}</div>
          <div class="hc-lvbar"><i style="width:${hi.progress}%"></i></div>
          <div class="hc-lvbar-text">
            <span>${hi.next?'Lv.'+hi.lv+' → Lv.'+(hi.lv+1):'满级'}</span>
            <span>${hi.next?total+'/'+hi.next.min+'天':'★'+hi.cur.name}</span>
          </div>
        </div>
      </div>
      <div class="hc-week">${wkDots}</div>
      ${rw?`<div class="hc-reward">${icon(rw.icon,15)}
        <span class="hc-rw-text">${lastRw?'已获得「'+lastRw.name+'」 · ':''}下一个奖励</span>
        <span class="hc-rw-next">${rw.days-total}天后解锁「${rw.name}」</span>
      </div>`:`<div class="hc-reward">${icon("crown",15)}
        <span class="hc-rw-text">全部奖励已解锁！传奇习惯</span>
      </div>`}
    </div>`;
  }).join("")}</div>`;
}

function recHTML(m,x){
  const pin=`<button class="pin-btn js-pin ${x.pinned?'on':''}" data-id="${x.id}" title="置顶">${icon("star",15)}</button>`;
  const del=`<button class="del js-del" data-id="${x.id}" title="删除">${icon("trash",15)}</button>`;
  const acts=`<div class="acts">${pin}${del}</div>`;
  const chkMark=icon("check",13,2.4);
  const thumb=x.image?`<img class="thumb" src="${attr(x.image)}" alt="">`:'';
  const customMeta=(m.fields||[]).filter(f=>x[f.key]).map(f=>`<span class="meta-tag">${esc(x[f.key])}</span>`).join("");
  const customBlock=customMeta?`<div class="meta-line">${customMeta}</div>`:'';
  const layout=x.layout||'default';
  const layoutCls=`rec-layout-${layout}`;

  // feature layout: 大图在上 + 标题 + 正文在下 (适合有图记录)
  if(layout==='feature' && x.image){
    const body=(x.content||x.note||'').trim();
    return `<div class="rec ${layoutCls}">${acts}<div class="top" data-edit="${x.id}">
      ${thumb}
      <div class="feat-title">${esc(x.title||'无标题')}</div>
      ${body?`<div class="feat-body">${esc(body)}</div>`:''}
      ${customBlock?`<div style="padding:0 16px 14px">${customBlock}</div>`:''}</div></div>`;
  }
  // quote layout: 大字居中 (适合短文本/灵感/金句)
  if(layout==='quote'){
    const text=(x.content||x.title||'').trim();
    return `<div class="rec ${layoutCls}">${acts}<div class="top" data-edit="${x.id}" style="flex-direction:column;align-items:center;text-align:center">
      <div class="quote-text">${esc(text)}</div>
      ${x.mood?`<div class="quote-meta">${esc(x.mood)}${x.date?` · ${esc(x.date)}`:''}</div>`:(x.date?`<div class="quote-meta">${esc(x.date)}</div>`:'')}
      ${customBlock?`<div style="margin-top:8px">${customBlock}</div>`:''}</div></div>`;
  }

  // default layout
  if(m.type==="todo"){ const p=(m.priorities||[]).find(p=>p.key===x.priority);
    const urg = x.remindAt && !x.done ? remindUrgency(x.remindAt, x.repeat) : null;
    const remindBadge = remindBadgeHTML(x.remindAt, x.repeat);
    const urgAttr = urg && urg.level==="overdue" ? ` data-urgent="overdue"` : "";
    return `<div class="rec ${layoutCls}"${urgAttr}>${acts}<div class="top" style="padding-right:60px"><div class="chk js-chk ${x.done?'on':''}" data-id="${x.id}">${chkMark}</div>
      ${thumb}
      <div class="body" data-edit="${x.id}"><span class="rname ${x.done?'done':''}">${esc(x.title)}</span>
      ${x.auto?`<span class="auto-badge" title="自动提取">自动</span>`:''}
      ${p?`<span class="badge" style="background:${p.color};color:${p.text}"><span class="dot"></span>${p.label}</span>`:''}
      ${x.importance&&x.urgency?`<span class="iu-badge" title="重要度 ${x.importance}/5 · 紧急度 ${x.urgency}/5">I${x.importance}·U${x.urgency}</span>`:''}
      ${remindBadge}
      ${x.note?`<span class="rdate" style="margin-left:0;color:var(--text-tertiary)">${esc(x.note).slice(0,40)}</span>`:''}${customBlock}</div></div></div>`; }
  if(m.type==="checkin"){ const on=!!(x.log&&x.log[today()]); const st=streak(x.log);
    return `<div class="rec ${layoutCls}">${acts}<div class="top" style="padding-right:60px"><div class="chk js-chk ${on?'on':''}" data-id="${x.id}">${chkMark}</div>
      ${thumb}
      <div class="body" data-edit="${x.id}"><span class="rname">${esc(x.title)}</span>
      <span class="streak">${icon("flame",13)} 连续 ${st} 天</span>${on?'<span class="badge" style="background:var(--accent-muted);color:var(--accent)">今日已打卡</span>':''}${customBlock}</div></div></div>`; }
  if(m.type==="progress"){ const pct=Math.min(100,Math.round((x.current/x.target)*100||0));
    return `<div class="rec ${layoutCls}">${acts}<div class="top" style="padding-right:60px">${thumb}<div class="body" data-edit="${x.id}">
      <span class="rname">${esc(x.title)}</span>
      <div class="pbar"><i style="width:${pct}%;background:${m.color}"></i></div>
      <span class="rdate" style="margin-left:0;color:var(--text-secondary)">${x.current}/${x.target} ${x.unit||m.unit||''} · ${pct}%</span>
      ${x.note?`<div class="rnote">${esc(x.note)}</div>`:''}${customBlock}</div></div></div>`; }
  if(m.type==="finance"){ const inc=x.type==="income";
    return `<div class="rec ${layoutCls}">${acts}<div class="top" style="padding-right:60px">${thumb}<div class="body" data-edit="${x.id}">
      <span class="rname">${esc(x.title)}</span>
      <span class="badge" style="background:var(--surface-nested);color:var(--text-secondary)">${esc(x.category||'其他')}</span>
      <span class="rdate">${x.date||''}</span>${customBlock}</div>
      <div class="amt ${inc?'inc':'exp'}">${inc?'+':'-'}¥${x.amount}</div></div></div>`; }
  // note
  return `<div class="rec ${layoutCls}">${acts}<div class="top" style="padding-right:60px">${thumb}<div class="body" data-edit="${x.id}">
    <span class="rname">${esc(x.title||'无标题')}</span>
    ${x.mood?`<span class="badge" style="background:var(--accent-muted);color:var(--accent)">${esc(x.mood)}</span>`:''}
    ${x.content?`<span class="rdate" style="margin-left:0;color:var(--text-tertiary)">${esc(x.content).slice(0,40)}</span>`:''}
    <span class="rdate">${x.date||''}</span>${customBlock}</div></div></div>`;
}

function streak(log){ if(!log) return 0; let n=0; const d=new Date();
  for(;;){ const k=d.toISOString().slice(0,10); if(log[k]){ n++; d.setDate(d.getDate()-1);} else break; } return n; }

function wireModule(key){ const m=modOf(key);
  $("#screen").querySelectorAll(".js-chk").forEach(el=>el.onclick=e=>{ e.stopPropagation();
    const x=(data[key]).find(i=>i.id==el.dataset.id);
    if(m.type==="todo"){ x.done=!x.done; x.doneDate = x.done ? isoToday() : ""; }
    else if(m.type==="checkin"){ x.log=x.log||{}; const t=today(); x.log[t]?delete x.log[t]:x.log[t]=true;
      /* 打卡奖励 toast */
      if(x.log[t]){ const newTotal=totalCheckinDays(x.log); const rw=lastReward(newTotal);
        if(rw && newTotal===rw.days){ toast({type:"auto",title:`🎉 ${rw.name}！`,msg:`「${esc(x.title)}」达成 ${rw.days} 天成就`,duration:4000}); }
        else { toast({type:"auto",title:`✓ 打卡成功`,msg:`「${esc(x.title)}」连续 ${streak(x.log)} 天 · 累计 ${newTotal} 天`,duration:2500}); }
      }
    }
    persist(); });
  /* 游戏化打卡圆圈点击 */
  $("#screen").querySelectorAll(".js-habit-chk").forEach(el=>el.onclick=e=>{ e.stopPropagation();
    const x=(data[key]).find(i=>i.id==el.dataset.id); if(!x) return;
    x.log=x.log||{}; const t=today(); x.log[t]?delete x.log[t]:x.log[t]=true;
    if(x.log[t]){ const newTotal=totalCheckinDays(x.log); const rw=lastReward(newTotal);
      if(rw && newTotal===rw.days){ toast({type:"auto",title:`🎉 ${rw.name}！`,msg:`「${esc(x.title)}」达成 ${rw.days} 天成就`,duration:4000}); }
      else { toast({type:"auto",title:`✓ 打卡成功`,msg:`「${esc(x.title)}」连续 ${streak(x.log)} 天 · 累计 ${newTotal} 天`,duration:2500}); }
    }
    persist(); });
  $("#screen").querySelectorAll("[data-edit]").forEach(el=>el.onclick=()=>openEditor(key,(data[key]).find(i=>i.id==el.dataset.edit)));
  $("#screen").querySelectorAll(".js-del").forEach(el=>el.onclick=e=>{ e.stopPropagation(); confirmDelete(key, el.dataset.id); });
  $("#screen").querySelectorAll(".js-pin").forEach(el=>el.onclick=e=>{ e.stopPropagation(); const x=(data[key]).find(i=>i.id==el.dataset.id); x.pinned=!x.pinned; persist(); });
  // 四象限拖拽：拖动 q-item 到不同象限，自动修改 importance/urgency
  const dragItems=$("#screen").querySelectorAll(".q-item[draggable]");
  const dropCols=$("#screen").querySelectorAll(".q-col[data-q]");
  let dragId=null;
  dragItems.forEach(el=>{
    el.addEventListener("dragstart",e=>{
      dragId=el.dataset.id;
      el.classList.add("dragging");
      e.dataTransfer.effectAllowed="move";
      e.dataTransfer.setData("text/plain",el.dataset.id);
    });
    el.addEventListener("dragend",()=>{ el.classList.remove("dragging"); dropCols.forEach(c=>c.classList.remove("drag-over")); });
  });
  dropCols.forEach(col=>{
    col.addEventListener("dragover",e=>{ e.preventDefault(); e.dataTransfer.dropEffect="move"; col.classList.add("drag-over"); });
    col.addEventListener("dragleave",()=>col.classList.remove("drag-over"));
    col.addEventListener("drop",e=>{
      e.preventDefault(); col.classList.remove("drag-over");
      const id=e.dataTransfer.getData("text/plain")||dragId; if(!id) return;
      const x=(data.todo||[]).find(i=>String(i.id)===String(id)); if(!x) return;
      const q=col.dataset.q;
      /* Q1:重要+紧急 Q2:重要+不紧急 Q3:不重要+紧急 Q4:不重要+不紧急 */
      const newVals={q1:{i:5,u:5},q2:{i:5,u:1},q3:{i:1,u:5},q4:{i:1,u:1}}[q];
      if(!newVals) return;
      x.importance=newVals.i; x.urgency=newVals.u;
      persist();
    });
  });
}

/* ---------- EDITOR MODAL (per type) ---------- */
function openEditor(key,item){
  const m=modOf(key); const editing=!!item; const d=item||newItem(m);
  let fields="";
  if(m.type==="todo"){
    const imp=d.importance||3, urg=d.urgency||3;
    fields=`<div class="field"><label>任务</label><input id="f-title" value="${attr(d.title)}" placeholder="要做什么？"/></div>
      <div class="field"><label>优先级</label><div class="seg" id="f-prio">${(m.priorities||[]).map(p=>`<div class="opt ${p.key===d.priority?'on':''}" data-v="${p.key}">${p.label}</div>`).join("")}</div></div>
      <div class="field"><label>四象限定位（点击格子）</label>
        <div class="quad-picker" id="quadPicker">
          <div class="qp-y">↑ 紧急</div>
          <div class="qp-grid">
            ${[5,4,3,2,1].map(r=>[1,2,3,4,5].map(c=>{
              const q = c>=3&&r>=3?'q1':c>=3&&r<3?'q2':c<3&&r>=3?'q3':'q4';
              const on = imp===c&&urg===r?'on':'';
              return `<div class="qp-cell ${q} ${on}" data-imp="${c}" data-urg="${r}" title="重要${c} 紧急${r}"></div>`;
            }).join("")).join("")}
          </div>
          <div class="qp-x">重要 →</div>
        </div>
        <input type="hidden" id="f-imp" value="${imp}"/><input type="hidden" id="f-urg" value="${urg}"/>
        <div class="qp-legend"><span class="ql q1">Q1 重要紧急</span><span class="ql q2">Q2 重要不紧急</span><span class="ql q3">Q3 不重要紧急</span><span class="ql q4">Q4 不重要不紧急</span></div>
      </div>
      <div class="field"><label>提醒时间（可选）</label>
        <input id="f-remind" type="datetime-local" value="${attr((d.remindAt||'').slice(0,16))}" style="flex:1"/>
        <label class="repeat-toggle" style="display:flex;align-items:center;gap:6px;margin-top:6px;cursor:pointer;font-size:12.5px;color:var(--text-secondary)">
          <input type="checkbox" id="f-repeat" ${d.repeat==='weekly'?'checked':''} style="width:16px;height:16px;cursor:pointer"/>
          每周重复（不标记逾期，自动顺延到下周同一时间）</label>
        <p class="sub" style="margin:5px 0 0;font-size:11.5px">到点会同时触发浏览器通知 + 应用内 toast（页面需保持打开）</p></div>
      <div class="field"><label>备注</label><textarea id="f-note" placeholder="补充说明">${esc(d.note||'')}</textarea></div>`;
  } else if(m.type==="checkin"){
    fields=`<div class="field"><label>打卡项</label><input id="f-title" value="${attr(d.title)}" placeholder="例如：喝够 8 杯水"/></div>
      <p class="sub" style="margin:0">保存后可在卡片点击左侧方块打卡；连续天数自动统计，每天从零开始。</p>`;
  } else if(m.type==="progress"){
    fields=`<div class="field"><label>名称</label><input id="f-title" value="${attr(d.title)}" placeholder="书名 / 目标"/></div>
      <div class="frow"><div class="field"><label>当前</label><input id="f-cur" type="number" value="${d.current??0}"/></div>
      <div class="field"><label>目标</label><input id="f-tgt" type="number" value="${d.target??1}"/></div>
      <div class="field"><label>单位</label><input id="f-unit" value="${attr(d.unit||m.unit||'')}"/></div></div>
      <div class="field"><label>摘录 / 想法</label><textarea id="f-note" placeholder="随手记">${esc(d.note||'')}</textarea></div>`;
  } else if(m.type==="finance"){
    fields=`<div class="field"><label>类型</label><div class="seg" id="f-ftype">
        <div class="opt ${d.type!=='income'?'on':''}" data-v="expense">支出</div><div class="opt ${d.type==='income'?'on':''}" data-v="income">收入</div></div></div>
      <div class="frow"><div class="field"><label>项目</label><input id="f-title" value="${attr(d.title)}" placeholder="午餐 / 稿费"/></div>
      <div class="field"><label>金额 ¥</label><input id="f-amt" type="number" value="${d.amount??''}" placeholder="0"/></div></div>
      <div class="field"><label>分类</label><div class="seg" id="f-cat">${(m.categories||[]).map(c=>`<div class="opt ${c===d.category?'on':''}" data-v="${attr(c)}" style="flex:0 0 auto;min-width:auto">${esc(c)}</div>`).join("")}</div></div>
      <div class="field"><label>日期</label><input id="f-date" type="date" value="${d.date||isoToday()}"/></div>`;
  } else {
    fields=`<div class="field"><label>标题</label><input id="f-title" value="${attr(d.title)}" placeholder="给这条起个名"/></div>
      ${(m.moods&&m.moods.length)?`<div class="field"><label>标签 / 心情</label><div class="seg" id="f-mood">${m.moods.map(md=>`<div class="opt ${md===d.mood?'on':''}" data-v="${attr(md)}" style="flex:0 0 auto;min-width:auto">${md}</div>`).join("")}</div></div>`:''}
      <div class="field"><label>内容</label><textarea id="f-content" placeholder="写点什么…">${esc(d.content||'')}</textarea></div>
      <div class="field"><label>日期</label><input id="f-date" type="date" value="${d.date||isoToday()}"/></div>`;
  }
  // layout variant selector
  const layoutOpts=[{v:'default',l:'标准'},{v:'feature',l:'大图'},{v:'quote',l:'引文'}];
  fields=`<div class="field"><label>卡片样式</label><div class="seg" id="f-layout">${layoutOpts.map(o=>`<div class="opt ${o.v===(d.layout||'default')?'on':''}" data-v="${o.v}">${o.l}</div>`).join("")}</div></div>`+fields;
  // custom fields (from m.fields config) — rendered after type-specific fields
  (m.fields||[]).forEach(f=>{
    const v=d[f.key]||"";
    if(f.type==="select") fields+=`<div class="field"><label>${esc(f.label)}</label><div class="seg" id="f-cf-${f.key}">${(f.options||[]).map(o=>`<div class="opt ${o===v?'on':''}" data-v="${attr(o)}" style="flex:0 0 auto;min-width:auto">${esc(o)}</div>`).join("")}</div></div>`;
    else if(f.type==="textarea") fields+=`<div class="field"><label>${esc(f.label)}</label><textarea id="f-cf-${f.key}" placeholder="${attr(f.placeholder||'')}">${esc(v)}</textarea></div>`;
    else if(f.type==="number") fields+=`<div class="field"><label>${esc(f.label)}</label><input id="f-cf-${f.key}" type="number" value="${attr(v)}" placeholder="${attr(f.placeholder||'')}"/></div>`;
    else fields+=`<div class="field"><label>${esc(f.label)}</label><input id="f-cf-${f.key}" value="${attr(v)}" placeholder="${attr(f.placeholder||'')}"/></div>`;
  });
  // shared image URL field (all types)
  fields+=`<div class="field"><label>图片 URL（可选）</label><input id="f-image" value="${attr(d.image||'')}" placeholder="https://..."/></div>`;
  const overlay=document.createElement("div"); overlay.className="overlay";
  overlay.innerHTML=`<div class="modal"><h3>${editing?'编辑':'新建'} · ${m.name}</h3><div class="sub">${m.desc}</div>${fields}
    <div class="modal-actions">${editing?'<button class="link-danger" id="m-del">删除</button>':''}<div class="spacer"></div>
      <button class="btn ghost" id="m-cancel">取消</button><button class="btn" id="m-save">保存</button></div></div>`;
  document.body.appendChild(overlay);
  const close=()=>overlay.remove();
  overlay.onclick=e=>{ if(e.target===overlay) close(); };
  overlay.querySelector("#m-cancel").onclick=close;
  overlay.querySelectorAll(".seg").forEach(seg=>seg.querySelectorAll(".opt").forEach(o=>o.onclick=()=>{ seg.querySelectorAll(".opt").forEach(x=>x.classList.remove("on")); o.classList.add("on"); }));
  // 四象限选择器
  const qp = overlay.querySelector("#quadPicker");
  if(qp){
    qp.querySelectorAll(".qp-cell").forEach(cell=>{
      cell.onclick = ()=>{
        qp.querySelectorAll(".qp-cell").forEach(c=>c.classList.remove("on"));
        cell.classList.add("on");
        overlay.querySelector("#f-imp").value = cell.dataset.imp;
        overlay.querySelector("#f-urg").value = cell.dataset.urg;
      };
    });
  }
  if(editing) overlay.querySelector("#m-del").onclick=()=>{ close(); confirmDelete(key,d.id); };
  overlay.querySelector("#m-save").onclick=()=>{
    const val=id=>{ const el=overlay.querySelector(id); return el?el.value:undefined; };
    const seg=id=>{ const el=overlay.querySelector(id+" .on"); return el?el.dataset.v:undefined; };
    d.title=(val("#f-title")||"").trim()||"未命名";
    d.layout=seg("#f-layout")||'default';
    if(m.type==="todo"){ d.priority=seg("#f-prio")||d.priority; d.note=(val("#f-note")||"").trim();
      d.importance = Math.max(1,Math.min(5,+val("#f-imp")||3));
      d.urgency = Math.max(1,Math.min(5,+val("#f-urg")||3));
      const r=val("#f-remind"); d.remindAt = r ? `${r}:00` : "";
      d.repeat = overlay.querySelector("#f-repeat")?.checked ? "weekly" : ""; }
    else if(m.type==="progress"){ d.current=Math.max(0,+val("#f-cur")||0); d.target=Math.max(1,+val("#f-tgt")||1); d.unit=(val("#f-unit")||"").trim(); d.note=(val("#f-note")||"").trim(); }
    else if(m.type==="finance"){ d.type=seg("#f-ftype")||"expense"; d.amount=Math.max(0,+val("#f-amt")||0); d.category=seg("#f-cat")||(m.categories&&m.categories[0])||"其他"; d.date=val("#f-date"); }
    else if(m.type==="note"){ d.mood=seg("#f-mood")||d.mood||""; d.content=(val("#f-content")||"").trim(); d.date=val("#f-date"); }
    // save custom fields
    (m.fields||[]).forEach(f=>{
      if(f.type==="select") d[f.key]=seg("#f-cf-"+f.key)||d[f.key]||"";
      else if(f.type==="number") d[f.key]=Math.max(0,+val("#f-cf-"+f.key)||0);
      else d[f.key]=(val("#f-cf-"+f.key)||"").trim();
    });
    // save image
    d.image=(val("#f-image")||"").trim();
    if(!editing) (data[key]=data[key]||[]).unshift(d);
    persist(); close();
    // note 类型保存后触发自动任务提取
    if(m.type==="note"){ setTimeout(()=>processAutoExtraction(d, key), 50); }
  };
}

function newItem(m){ const base={id:Date.now()}; let item;
  if(m.type==="todo") item={...base,title:"",priority:(m.priorities&&m.priorities[1]?m.priorities[1].key:"P1"),done:false,doneDate:"",note:"",remindAt:"",auto:false,importance:3,urgency:3};
  else if(m.type==="checkin") item={...base,title:"",log:{}};
  else if(m.type==="progress") item={...base,title:"",current:0,target:(m.unit==="页"?100:20),unit:m.unit||"",note:""};
  else if(m.type==="finance") item={...base,title:"",type:"expense",amount:"",category:(m.categories&&m.categories[0])||"其他",date:isoToday()};
  else item={...base,title:"",content:"",mood:(m.moods&&m.moods[0])||"",date:isoToday()};
  // initialize custom fields
  (m.fields||[]).forEach(f=>{ if(!(f.key in item)) item[f.key]= f.type==="select"?(f.options&&f.options[0]||""):""; });
  return item;
}

/* ---------- delete confirm ---------- */
function confirmDelete(key,id){ const item=(data[key]||[]).find(i=>i.id==id); if(!item) return;
  const overlay=document.createElement("div"); overlay.className="overlay";
  overlay.innerHTML=`<div class="modal" style="width:400px"><h3>删除记录</h3><div class="sub">确定删除「${esc(item.title||'这条记录')}」？此操作不可撤销。</div>
    <div class="modal-actions"><div class="spacer"></div><button class="btn ghost" id="c-cancel">取消</button><button class="btn danger" id="c-ok">删除</button></div></div>`;
  document.body.appendChild(overlay);
  const close=()=>overlay.remove();
  overlay.onclick=e=>{ if(e.target===overlay) close(); };
  overlay.querySelector("#c-cancel").onclick=close;
  overlay.querySelector("#c-ok").onclick=()=>{ data[key]=data[key].filter(i=>i.id!=id); persist(); close(); };
}

/* ---------- router / sidebar ---------- */
function dateStr(){ const n=new Date(); const wd="日一二三四五六"[n.getDay()]; return `${n.getFullYear()}年${n.getMonth()+1}月${n.getDate()}日 周${wd}`; }
function go(v){ view=v; searchQ=""; renderNavActive(); render(); window.scrollTo({top:0}); }
function render(){
  if(view==="home") renderHome();
  else if(view==="insight") renderInsight();
  else if(view==="calendar") renderCalendar();
  else if(view==="auto") renderAutoExtract();
  else if(view==="dingtalk") renderDingTalk();
  else if(view==="external") renderExternal();
  else if(view==="pomo") renderPomoPage();
  else renderModule(view);
}

/* ---------- 时间工具 ---------- */
function isToday(dateStr){ if(!dateStr) return false; return dateStr === isoToday(); }
/* 判断待办是否属于今天：无提醒时间视为今天，有提醒时间则日期须为今天 */
/* 每周重复的待办：检查顺延后的有效提醒时间是否在今天 */
function isTodoToday(x){
  if(!x.remindAt) return true;
  if(x.repeat==="weekly"){
    const t=getEffectiveRemindAt(x);
    if(!t) return true;
    return t.toISOString().slice(0,10) === isoToday();
  }
  const t=new Date(x.remindAt);
  if(isNaN(t.getTime())) return true;
  return t.toISOString().slice(0,10) === isoToday();
}
function todayTs(){ return new Date(`${isoToday()}T00:00:00`).getTime(); }
function parseRemindAt(str){ if(!str) return null; const t = new Date(str); return isNaN(t.getTime()) ? null : t; }
function fmtTime(dateStr){ if(!dateStr) return ""; const d = new Date(dateStr); if(isNaN(d.getTime())) return "";
  const wd = "日一二三四五六"[d.getDay()];
  return `${pad2(d.getMonth()+1)}-${pad2(d.getDate())} 周${wd} ${pad2(d.getHours())}:${pad2(d.getMinutes())}`; }

/* 提醒紧急度：返回 {level:"overdue"|"today"|"soon"|"later", label} */
/* 对每周重复的待办，传入 repeat="weekly" 则自动顺延到下次提醒时间，不返回 overdue */
function remindUrgency(remindAt, repeat){
  if(!remindAt) return null;
  let t = new Date(remindAt);
  if(isNaN(t.getTime())) return null;
  const now = new Date();
  /* 每周重复：如果已过期，自动顺延到下周同一时间 */
  if(repeat==="weekly" && t.getTime() < now.getTime()){
    while(t.getTime() < now.getTime()) t.setDate(t.getDate()+7);
  }
  const diff = t.getTime() - now.getTime();
  if(diff < 0) return { level:"overdue", label:"已逾期" };
  if(diff < 60*60*1000) return { level:"soon", label:`${Math.ceil(diff/60000)}分钟后` };
  if(t.toDateString() === now.toDateString()) return { level:"today", label:`今天 ${pad2(t.getHours())}:${pad2(t.getMinutes())}` };
  if(diff < 2*24*60*60*1000) return { level:"soon", label:fmtTime(t.toISOString()) };
  return { level:"later", label:repeat==="weekly"?"每周"+fmtTime(t.toISOString()):fmtTime(t.toISOString()) };
}
/* 统一渲染提醒徽章 HTML（含紧急度配色） */
function remindBadgeHTML(remindAt, repeat){
  if(!remindAt) return "";
  const urg = remindUrgency(remindAt, repeat);
  if(!urg) return `<span class="remind-badge later" style="background:var(--surface-nested);color:var(--text-tertiary)">${icon("bell",12,2)} ${fmtTime(remindAt)}</span>`;
  const colors = { overdue:{c:"#c25d4f",b:"#f6ece9"}, today:{c:"#bd8a4e",b:"#f6efe6"}, soon:{c:"#5f7a99",b:"#edf1f5"}, later:{c:"#8c877c",b:"#f7f6f1"} };
  const k = colors[urg.level];
  return `<span class="remind-badge ${urg.level}" style="background:${k.b};color:${k.c};border-color:${k.c}33">${icon("bell",12,2.2)} ${urg.label}</span>`;
}
/* 获取有效提醒时间（每周重复则自动顺延） */
function getEffectiveRemindAt(x){
  if(!x.remindAt) return null;
  let t = new Date(x.remindAt);
  if(isNaN(t.getTime())) return null;
  if(x.repeat==="weekly"){
    const now = new Date();
    while(t.getTime() < now.getTime()) t.setDate(t.getDate()+7);
  }
  return t;
}
function addDaysISO(iso, n){ const d = new Date(`${iso}T00:00:00`); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); }
function isoToDate(iso){ return new Date(`${iso}T00:00:00`); }
function monthLabel(d){ return `${d.getFullYear()}年${d.getMonth()+1}月`; }

let toastStack = null;
function ensureToastStack(){
  if(toastStack) return toastStack;
  toastStack = document.createElement("div");
  toastStack.className = "toast-stack";
  document.body.appendChild(toastStack);
  return toastStack;
}
function toast(opts){
  const { type="info", title="", msg="", actions=[], duration=5000 } = opts;
  const stack = ensureToastStack();
  const el = document.createElement("div");
  el.className = `toast ${type}`;
  const ic = type==="remind"?"bell":type==="ding"?"send":type==="auto"?"sparkles":"bell";
  el.innerHTML = `<div class="tic">${icon(ic,17)}</div>
    <div class="tb"><div class="tt">${esc(title)}</div>${msg?`<div class="tm">${esc(msg)}</div>`:""}
      ${actions.length?`<div class="tx">${actions.map((a,i)=>`<button data-i="${i}">${esc(a.label)}</button>`).join("")}</div>`:""}</div>
    <button class="close" title="关闭">${icon("close",14,2)}</button>`;
  stack.appendChild(el);
  const remove = ()=>{ el.style.transition="opacity .2s, transform .2s"; el.style.opacity=0; el.style.transform="translateX(20px)"; setTimeout(()=>el.remove(), 220); };

/* ============================================================
   自动任务提取引擎（本地规则识别）
   - 切分文本段（句号/分号/换行）
   - 识别时间关键词（绝对日期 / 相对日期 / 时间点）
   - 识别动作关键词（要/得/需要/记得/提醒/ deadline 等）
   - 同时命中则提取为待办
   ============================================================ */
const AUTO_RULES = {
  // 相对日期 → 偏移天数
  relDates: [
    { re:/(今天|今日|当天)/, offset:0 },
    { re:/(明天|明日|次日)/, offset:1 },
    { re:/(后天)/, offset:2 },
    { re:/(大后天)/, offset:3 },
    { re:/(昨天|昨日)/, offset:-1 },
    { re:/(下周一|下周一)/, offset:7-((new Date().getDay()+6)%7)+1 },
    { re:/(下周末)/, offset:7-((new Date().getDay()+6)%7)+5 },
    { re:/(本周一|这周一)/, offset:0-((new Date().getDay()+6)%7)+1 },
    { re:/(本周末|这周末)/, offset:5-((new Date().getDay()+6)%7) },
  ],
  // 周X → 偏移天数
  weekday: /([本周下]{1,2})?(周|星期)([一二三四五六日天])/,
  weekdayMap: { "一":1, "二":2, "三":3, "四":4, "五":5, "六":6, "日":7, "天":7 },
  // 绝对日期：X号 / X月X日 / X月X号
  absDate: [ /(\d{1,2})月(\d{1,2})[号日]/, /(\d{1,2})[号日]前?/ ],
  // 时间点：HH:MM / X点 / X点半
  time: [ /(\d{1,2}):(\d{2})/, /(\d{1,2})点(半)?(\d{0,2})?/ ],
  // 动作关键词（覆盖微信/钉钉常见任务表述）
  actions: /(要|得|需要|记得|提醒我?|该|应该|必须|deadline|DDL|ddl|截止|抓紧|务必|尽快|下周|本周|明天|今天|号前|日前|点前|之前|确认|回复|跟进|安排|准备|提交|上报|对接|商量|讨论|约|找|发|给|整理|梳理|发邮件|回复|确认下|过下|对一下|同步一下|loop|处理一下|办一下|弄一下|做一下|准备一下|赶完|搞定|完成)/i,
  // 排除关键词（这些段落不算待办）
  exclude: /^(我感觉|我觉得|我想说|注意：|备注：|注释|哈哈|呵呵|好的|收到|嗯嗯|对的)/,
};

function splitSentences(text){
  return (text||"")
    .split(/[；;\n。\.！!？?]+/)
    .map(s=>s.trim())
    .filter(s=>s.length >= 4 && s.length <= 80);
}

function parseTimeFromSegment(seg){
  const now = new Date();
  let baseDate = isoToday();
  let timeStr = "";
  let matched = false;

  // 相对日期
  for(const r of AUTO_RULES.relDates){
    if(r.re.test(seg)){ baseDate = addDaysISO(isoToday(), r.offset); matched = true; break; }
  }
  // 周X
  const wm = seg.match(AUTO_RULES.weekday);
  if(wm){
    const tgt = AUTO_RULES.weekdayMap[wm[3]];
    if(tgt){
      const todayDow = (now.getDay()+6)%7;  // 周一=0
      let offset = tgt - 1 - todayDow;
      if(wm[1] && wm[1].includes("下")) offset += 7;
      if(offset < 0) offset += 7;
      baseDate = addDaysISO(isoToday(), offset);
      matched = true;
    }
  }
  // 绝对日期 X月X日
  for(const re of AUTO_RULES.absDate){
    const m = seg.match(re);
    if(m){
      let month, day;
      if(m.length === 3){ month = +m[1]; day = +m[2]; }
      else { month = now.getMonth()+1; day = +m[1]; }
      const year = now.getFullYear();
      const d = new Date(year, month-1, day);
      if(d < new Date(year, now.getMonth(), now.getDate())) d.setFullYear(year+1);
      baseDate = d.toISOString().slice(0,10);
      matched = true;
      break;
    }
  }
  // 时间点
  for(const re of AUTO_RULES.time){
    const m = seg.match(re);
    if(m){
      let h = +m[1]; let mm = m[2]? +m[2] : (m[1] && m[1].includes("半")?30:0);
      if(re.source.includes("点") && !m[2]){ mm = m[1] && m[1].includes("半")?30:0; }
      if(m[0] && m[0].includes("半")) mm = 30;
      if(h>=0 && h<24){ timeStr = `${pad2(h)}:${pad2(mm||0)}`; matched = true; break; }
    }
  }
  if(!matched) return null;
  const full = timeStr ? `${baseDate}T${timeStr}:00` : `${baseDate}T09:00:00`;
  return full;
}

function autoExtractTasks(text){
  const segs = splitSentences(text);
  const results = [];
  segs.forEach(seg=>{
    if(AUTO_RULES.exclude.test(seg)) return;
    const remindAt = parseTimeFromSegment(seg);
    const hasAction = AUTO_RULES.actions.test(seg);
    // 命中条件：识别到时间 + 含动作关键词 OR 时间为绝对日期（更明确）
    if(remindAt && (hasAction || /(\d{1,2}[月号日])|周[一二三四五六日天]/.test(seg))){
      // 清理标题：移除时间片段，保留任务描述
      let title = seg
        .replace(/(今天|今日|明天|明日|后天|大后天|昨天|昨日|下周[一二三四五六日末]|本周[一二三四五六日末]|这周[一二三四五六日末])/g, "")
        .replace(/(周|星期)([一二三四五六日天])/g, "")
        .replace(/(\d{1,2})月(\d{1,2})[号日]/g, "")
        .replace(/(\d{1,2})[号日]前?/g, "")
        .replace(/(\d{1,2}):(\d{2})/g, "")
        .replace(/(\d{1,2})点半?/g, "")
        .replace(/^(要|得|需要|记得|提醒我?|该|应该|必须|抓紧|务必|尽快|deadline|DDL|ddl)/ig, "")
        .replace(/^(截止|之前|前)/g, "")
        .replace(/[，,。.；;！!？?]+/g, " ")
        .trim();
      if(title.length < 3) title = seg.trim();   // 兜底：清理后过短就用原文
      if(title.length > 60) title = title.slice(0, 60);
      results.push({ title, remindAt, note:`自动提取自：${seg}`, priority:"P1", auto:true });
    }
  });
  return results;
}

function getDingConfig(){ return data.__ding || { webhook:"", secret:"", robotName:"工作台助手", autoPush:false, lastPush:"" }; }

function buildTodoMarkdown(filterDone){
  const list = (data.todo||[]).filter(x=> !filterDone || !x.done);
  if(!list.length) return "_当前没有待办任务_";
  const byP = { P0:[], P1:[], P2:[] };
  list.forEach(x=>{ (byP[x.priority]||byP.P1).push(x); });
  const labels = { P0:"🔴 重要", P1:"🟡 一般", P2:"🟢 随手" };
  let md = `# 待办清单 · ${dateStr()}\n\n`;
  ["P0","P1","P2"].forEach(k=>{
    if(!byP[k].length) return;
    md += `## ${labels[k]}\n`;
    byP[k].forEach(x=>{
      const effT = getEffectiveRemindAt(x);
      const remind = effT ? ` ⏰ ${x.repeat==="weekly"?"每周":""}${fmtTime(effT.toISOString())}` : "";
      const note = x.note ? ` — ${x.note}` : "";
      md += `- [ ] ${x.title}${remind}${note}\n`;
    });
    md += "\n";
  });
  return md;
}

async function pushToDingTalk(){
  const cfg = getDingConfig();
  if(!cfg.webhook){ toast({type:"ding", title:"未配置 webhook", msg:"请先在钉钉集成页填入自定义机器人 webhook 地址", duration:6000}); return false; }
  const md = buildTodoMarkdown(false);
  const payload = {
    msgtype:"markdown",
    markdown:{ title:`待办清单 · ${dateStr()}`, text:md },
    at:{ isAtAll: false }
  };
  const body = JSON.stringify(payload);

  // 尝试 1：直接请求
  async function directPush(){
    const res = await fetch(cfg.webhook, { method:"POST", headers:{ "Content-Type":"application/json" }, body });
    const json = await res.json();
    return json;
  }
  // 尝试 2：走 CORS 代理（allorigins 支持 POST 透传）
  async function proxyPush(){
    const proxyUrl = "https://api.allorigins.win/post?url=" + encodeURIComponent(cfg.webhook);
    const res = await fetch(proxyUrl, {
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body: body
    });
    const text = await res.text();
    // allorigins 返回 { contents: "钉钉的json字符串" }
    try{
      const outer = JSON.parse(text);
      if(outer.contents){ try{ return JSON.parse(outer.contents); }catch(e){ return outer.contents; } }
      return outer;
    }catch(e){ return { errmsg: text.slice(0,200) }; }
  }

  let json;
  try{ json = await directPush(); }
  catch(e1){
    try{ json = await proxyPush(); }
    catch(e2){
      toast({type:"ding", title:"推送失败", msg:`直连和代理均失败：${e2.message}。<br>建议点「复制 markdown」手动粘贴到钉钉群`, duration:10000});
      return false;
    }
  }
  if(json.errcode === 0 || json.errcode === undefined){
    saveDingConfig({ lastPush: new Date().toISOString() });
    toast({type:"ding", title:"推送成功", msg:`已把 ${data.todo.filter(x=>!x.done).length} 条待办推送到钉钉群`, duration:5000});
    return true;
  } else {
    toast({type:"ding", title:"推送失败", msg:`钉钉返回：${json.errmsg || JSON.stringify(json).slice(0,150)}<br>建议改用「复制 markdown」手动发送`, duration:8000});
    return false;
  }
}

/* ============================================================
   日历视图 — 月度网格 + 当日事项
   ============================================================ */
let calCursor = isoToDate(isoToday());

function renderCalendar(){
  const y = calCursor.getFullYear();
  const m = calCursor.getMonth();
  const first = new Date(y, m, 1);
  const last = new Date(y, m+1, 0);
  const startDow = (first.getDay()+6)%7;   // 周一=0
  const totalDays = last.getDate();
  const prevLast = new Date(y, m, 0).getDate();

  const cells = [];
  // 上月填充
  for(let i=startDow-1;i>=0;i--){ cells.push({ iso:`${first.getFullYear()}-${pad2(first.getMonth()+1)}-${pad2(prevLast-i)}`, other:true, day: prevLast-i }); }
  // 当月
  for(let d=1; d<=totalDays; d++){ cells.push({ iso:`${y}-${pad2(m+1)}-${pad2(d)}`, other:false, day:d }); }
  // 下月填充到 42 格
  let nextDay = 1;
  while(cells.length < 42){ const dt = new Date(y, m+1, nextDay); cells.push({ iso: dt.toISOString().slice(0,10), other:true, day: nextDay }); nextDay++; }

  // 收集每日事项
  const eventsByDate = {};
  const addEv = (iso, ev)=>{ if(!eventsByDate[iso]) eventsByDate[iso]=[]; eventsByDate[iso].push(ev); };
  (data.todo||[]).forEach(x=>{
    const t=getEffectiveRemindAt(x); if(!t) return;
    const iso=t.toISOString().slice(0,10);
    addEv(iso, {type:"todo", text:x.title, done:x.done, key:"todo", id:x.id, priority:x.priority, repeat:x.repeat});
  });
  (data.goal||[]).forEach(x=>{ addEv(isoToday(), {type:"goal", text:`目标·${x.title}`, key:"goal", id:x.id}); });
  (data.checkin||[]).forEach(x=>{ if(x.log && x.log[isoToday()]) addEv(isoToday(), {type:"checkin", text:`✓ ${x.title}`, key:"checkin", id:x.id}); });
  (data.notes||[]).forEach(x=>{ if(x.date) addEv(x.date, {type:"note", text:x.title, key:"notes", id:x.id}); });
  (data.review||[]).forEach(x=>{ if(x.date) addEv(x.date, {type:"review", text:x.title, key:"review", id:x.id}); });

  const todayIso = isoToday();
  const cellsHTML = cells.map(c=>{
    const evs = eventsByDate[c.iso] || [];
    const cls = `cal-cell${c.other?" other":""}${c.iso===todayIso?" today":""}`;
    const evsHTML = evs.slice(0,3).map(e=>{ const priCls = e.type==="todo" ? ` pri-${e.priority||"P1"}` : "";
      return `<div class="cev ${e.type}${priCls}" data-mk="${e.key}" data-id="${e.id}" title="${attr(e.text)}">${esc(e.done?"✓ ":"")}${esc(e.text)}</div>`; }).join("");
    const more = evs.length>3 ? `<div class="cadd">+${evs.length-3} 更多</div>` : "";
    return `<div class="${cls}" data-date="${c.iso}">
      <div class="cd">${c.day}</div>${evsHTML}${more}</div>`;
  }).join("");

  const dows = ["周一","周二","周三","周四","周五","周六","周日"].map(d=>`<div class="dow">${d}</div>`).join("");

  // 当日事项侧栏
  const todayEvs = eventsByDate[todayIso] || [];
  const todayListHTML = todayEvs.length ? todayEvs.map(e=>`<div class="dl-item" data-mk="${e.key}" data-id="${e.id}">
    <div class="dli-t">${e.type==="todo"?(e.done?"✓ ":""):""}${esc(e.text)}</div>
    <div class="dli-m">${e.type==="todo"?"待办":e.type==="goal"?"目标":e.type==="checkin"?"打卡":e.type==="review"?"复盘":"灵感"} · 点击查看</div>
  </div>`).join("") : `<div class="empty" style="padding:30px 16px"><span class="e">${icon("calendar",24)}</span><div>今天暂无安排</div></div>`;

  // 近 7 天
  const upcoming = [];
  for(let i=0;i<7;i++){
    const iso = addDaysISO(todayIso, i);
    const evs = eventsByDate[iso] || [];
    if(evs.length) upcoming.push({ iso, evs });
  }
  const upcomingHTML = upcoming.length ? upcoming.map(u=>{
    const d = new Date(u.iso); const wd = "日一二三四五六"[d.getDay()];
    return `<div class="dl-item"><div class="dli-t">${u.iso===todayIso?"今天":`${d.getMonth()+1}/${d.getDate()} 周${wd}`}</div>
      ${u.evs.map(e=>`<div class="dli-m" data-mk="${e.key}" data-id="${e.id}">${e.type==="todo"?(e.done?"✓ ":""):""}${esc(e.text)}</div>`).join("")}</div>`;
  }).join("") : `<div class="empty" style="padding:20px 16px"><span class="e">${icon("calendar",20)}</span><div>未来 7 天暂无安排</div></div>`;

  $("#screen").innerHTML = `<div class="header"><div><h2>日历</h2><p>月度视图 · 当日事项 · 未来 7 天预告</p></div><div class="spacer"></div>
    <span class="date-chip">${icon("calendar",14)} ${dateStr()}</span></div>
    <div class="mod-layout">
      <div class="mod-main">
        <div class="cal-wrap">
          <div class="cal-head">
            <button class="nav-btn" id="cal-prev">${icon("chevronLeft",16,2)}</button>
            <h3>${monthLabel(calCursor)}</h3>
            <button class="nav-btn" id="cal-next">${icon("chevron",16,2)}</button>
            <button class="today-btn" id="cal-today">回到今天</button>
          </div>
          <div class="cal-grid">${dows}${cellsHTML}</div>
          <div class="cal-legend">
            <span class="lg"><i style="background:#c25d4f"></i>P0 紧急</span>
            <span class="lg"><i style="background:#bd8a4e"></i>P1 一般</span>
            <span class="lg"><i style="background:#5f7a99"></i>P2 随手</span>
            <span class="lg"><i style="background:#7a6a9a"></i>灵感</span>
            <span class="lg"><i style="background:#a07a5a"></i>打卡</span>
          </div>
        </div>
      </div>
      <aside class="cal-side">
        <div class="side-card"><div class="sh">${icon("calendar",15)} 今天 · ${todayIso.slice(5)}</div>
          <div class="cal-day-list">${todayListHTML}</div></div>
        <div class="side-card"><div class="sh">${icon("bell",15)} 未来 7 天</div>
          <div class="cal-day-list">${upcomingHTML}</div></div>
      </aside>
    </div>`;

  $("#cal-prev").onclick = ()=>{ calCursor = new Date(y, m-1, 1); renderCalendar(); };
  $("#cal-next").onclick = ()=>{ calCursor = new Date(y, m+1, 1); renderCalendar(); };
  $("#cal-today").onclick = ()=>{ calCursor = isoToDate(todayIso); renderCalendar(); };
  $("#screen").querySelectorAll(".cal-cell").forEach(el=>el.onclick=()=>{
    const iso = el.dataset.date;
    if(iso === todayIso) return;
    calCursor = isoToDate(iso); renderCalendar();
  });
  $("#screen").querySelectorAll(".cev, .dl-item [data-mk], .cal-day-list [data-mk]").forEach(el=>el.onclick=e=>{
    e.stopPropagation();
    const k = el.dataset.mk; const id = el.dataset.id;
    if(!k) return;
    const m = modOf(k); if(!m) return;
    const item = (data[k]||[]).find(x=>x.id == id);
    if(item) openEditor(k, item);
    else go(k);
  });
}

   ============================================================ */
let externalMsgs = [];     // 来自 /data/tasks.json 的外部任务（Trae 写入）
let externalTimer = null;

async function fetchExternalTasks(){
  try{
    const res = await fetch("data/tasks.json?t=" + Date.now(), { cache:"no-store" });
    if(!res.ok) return false;
    const json = await res.json();
    if(Array.isArray(json.tasks)) externalMsgs = json.tasks;
    if(Array.isArray(json.pending)) externalMsgs = externalMsgs.concat(json.pending);
    return true;
  }catch(e){ return false; }
}

function startExternalPolling(){
  if(externalTimer) return;
  fetchExternalTasks().then(ok=>{
    if(ok) externalTimer = setInterval(fetchExternalTasks, 60000);   // 存在 tasks.json 才轮询
  });
}

      <button class="del js-ext-reject" data-i="${i}" title="忽略">${icon("trash",15)}</button>
    </div>` : ""}
  </div>`;
}

/* 调 LLM API 提取任务 */
async function extractWithLLM(){
  const text = $("#ext-input").value.trim();
  if(!text){ toast({type:"info",title:"请先粘贴消息",msg:"从微信/钉钉复制后 Ctrl+V 粘贴",duration:3000}); return; }
  if(!data.__llmKey){
    toast({type:"info",title:"未配置 LLM",msg:"点右上角「设置LLM」填入 API Key",duration:4000});
    openLLMSettings();
    return;
  }
  const result = $("#ext-result");
  const btn = $("#ext-extract-llm");
  const oldHTML = btn.innerHTML;
  btn.disabled = true; btn.innerHTML = `${icon("refresh",14)} LLM 提取中...`;
  result.innerHTML = `<div class="empty" style="padding:20px"><span class="e">${icon("sparkles",24)}</span><div>正在调用 LLM 语义提取...</div></div>`;
  try{
    const provider = data.__llmProvider || "deepseek";
    const model = data.__llmModel || (provider==="deepseek"?"deepseek-chat":"glm-4-flash");
    const tasks = await callGLMExtract(text, data.__llmKey, model, provider, data.__llmUrl || "");
    renderLLMResult(tasks, "LLM 提取", "trae");
  }catch(e){
    result.innerHTML = `<div class="empty" style="padding:20px"><span class="e">${icon("close",24)}</span>
      <div>LLM 调用失败：${esc(e.message||"")}<br><br>建议：<br>1. 检查 API Key 是否正确<br>2. 网络是否能访问对应 API<br>3. 改用「规则提取」按钮（不依赖 LLM）</div></div>`;
  }finally{
    btn.disabled = false; btn.innerHTML = oldHTML;
  }
}

/* 调用 LLM API（DeepSeek / 智谱 / 自定义 OpenAI 兼容） */
async function callGLMExtract(text, apiKey, model, provider, customUrl){
  const prov = LLM_PROVIDERS[provider] || LLM_PROVIDERS.deepseek;
  const url = provider === "custom" ? customUrl : prov.url;
  const prompt = `你是一个任务提取助手。下面是从微信/钉钉聊天里复制的消息文本。请识别其中的"待办任务"，输出 JSON 数组，每个任务包含字段：
- title：任务简短描述（不超过40字，去掉时间词和动作词）
- priority：优先级，"P0"（重要/紧急/截止近）/"P1"（一般）/"P2"（随手）
- remindAt：提醒时间，ISO 格式如 "2026-09-14T15:00:00"，无法判断则空字符串
- note：原文相关上下文（不超过60字）

只输出 JSON 数组，不要 markdown 代码块包裹，不要解释。识别不到任务时返回 []。

今天日期：${new Date().toLocaleDateString("zh-CN")} ${new Date().toLocaleTimeString("zh-CN")}

消息文本：
"""
${text}
"""`;

  const res = await fetch(url, {
    method:"POST",
    headers:{
      "Content-Type":"application/json",
      "Authorization": `Bearer ${apiKey}`
    },
    body: JSON.stringify({
      model: model,
      messages: [{ role:"user", content: prompt }],
      temperature: 0.1,
      response_format: { type:"json_object" }
    })
  });
  if(!res.ok){
    const errText = await res.text();
    throw new Error(`HTTP ${res.status} ${errText.slice(0,200)}`);
  }
  const json = await res.json();
  const content = json.choices?.[0]?.message?.content || "[]";
  // 可能返回 {"tasks":[...]} 或直接数组
  let parsed;
  try{ parsed = JSON.parse(content); }catch(e){ throw new Error("LLM 返回非 JSON：" + content.slice(0,200)); }
  if(parsed && Array.isArray(parsed)) return parsed;
  if(parsed && Array.isArray(parsed.tasks)) return parsed.tasks;
  if(parsed && Array.isArray(parsed.result)) return parsed.result;
  return [];
}

/* 渲染 LLM/规则提取结果到 result 区域，支持点击确认 */
function renderLLMResult(tasks, sourceLabel, sourceTag){
  const result = $("#ext-result");
  if(!tasks.length){
    result.innerHTML = `<div class="empty" style="padding:20px"><span class="e">${icon("sparkles",24)}</span>
      <div>未识别到任务。<br><br>可能原因：<br>· 消息里都是闲聊，没有任务<br>· LLM 判断后认为没有可执行项<br><br>可以再粘其他消息试试。</div></div>`;
    return;
  }
  result.innerHTML = `<div class="sec-title" style="margin:8px 0">${sourceLabel} · 识别到 ${tasks.length} 条候选 · 点击 ✓ 加入待办</div>
    <div class="rec-grid">${tasks.map((t,i)=>`<div class="rec">
      <div class="top" style="padding-right:60px">
        <div class="body" style="flex-direction:column;align-items:stretch;gap:6px">
          <div><span class="rname">${esc(t.title||"")}</span><span class="auto-badge" style="background:var(--module-2);color:#fff">${sourceLabel}</span></div>
          ${t.priority?`<span class="badge" style="background:var(--accent-muted);color:var(--accent);font-size:11px">${esc(t.priority)}</span>`:""}
          ${t.remindAt?remindBadgeHTML(t.remindAt,t.repeat):""}
          ${t.note?`<div class="rnote">${esc(t.note)}</div>`:""}
        </div>
      </div>
      <div class="acts" style="opacity:1">
        <button class="pin-btn js-llm-accept" data-i="${i}" title="加入待办" style="color:var(--module-1)">${icon("check",15,2.4)}</button>
        <button class="del js-llm-reject" data-i="${i}" title="忽略">${icon("trash",15)}</button>
      </div>
    </div>`).join("")}</div>`;
  result.querySelectorAll(".js-llm-accept").forEach(el=>el.onclick=e=>{
    e.stopPropagation();
    const i = +el.dataset.i; const t = tasks[i]; if(!t) return;
    const item = { id: Date.now(), title: t.title || "未命名任务", priority: t.priority || "P1", done:false, note: t.note || "外部消息提取", remindAt: t.remindAt || "", auto:true, source: sourceTag, importance:t.importance||3, urgency:t.urgency||3 };
    (data.todo = data.todo||[]).unshift(item);
    persist();
    toast({type:"auto", title:"已加入待办", msg:`「${t.title}」已加入待办清单`, duration:4000});
    tasks.splice(i,1);
    renderLLMResult(tasks, sourceLabel, sourceTag);
  });
  result.querySelectorAll(".js-llm-reject").forEach(el=>el.onclick=e=>{
    e.stopPropagation();
    const i = +el.dataset.i;
    tasks.splice(i,1);
    renderLLMResult(tasks, sourceLabel, sourceTag);
  });
}

function extractFromPaste(){

      <b>建议：</b>改用「LLM 提取任务」按钮，能识别语义级任务。</div></div>`;
    return;

}

function esc(s){ return String(s??"").replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function attr(s){ return esc(s).replace(/"/g,'&quot;'); }

/* ---------- 主题切换 ---------- */
const THEMES = {
  paper:    { name:"报刊编辑", desc:"深绿侧栏 · 羊皮纸底 · 衬线标题" },
  retro:    { name:"复古珊瑚", desc:"珊瑚青撞色 · 圆点底 · 圆润亲切" },
  crimson:  { name:"赛博朋克", desc:"霓虹光 · 暗夜底 · 网格线 · 霓虹色" },
  starry:   { name:"星图集",   desc:"银河星图底 · 琉璃卡片 · 高对比" }
};
function applyTheme(theme){
  if(!THEMES[theme]) theme = "paper";
  if(theme === "paper"){ document.documentElement.removeAttribute("data-theme"); }
  else { document.documentElement.setAttribute("data-theme", theme); }
  try { localStorage.setItem("wb-theme", theme); } catch(e){}
  // 更新切换器选中态
  document.querySelectorAll(".ts-opt").forEach(btn=>{
    btn.classList.toggle("active", btn.dataset.theme === theme);
  });
}
function initThemeSwitcher(){
  const saved = (()=>{ try{ return localStorage.getItem("wb-theme"); }catch(e){ return null; } })();
  applyTheme(saved || "paper");
  document.querySelectorAll(".ts-opt").forEach(btn=>{
    btn.onclick = ()=>{
      const t = btn.dataset.theme;
      applyTheme(t);
      const info = THEMES[t];
      toast({ type:"info", title:`已切换：${info.name}`, msg: info.desc, duration: 2200 });
    };
  });
}
initThemeSwitcher();

/* ---------- 字体切换 ---------- */
const FONT_STACKS = {
  default:  "",
  songti:   '"Noto Serif SC", "Songti SC", "Source Han Serif SC", "SimSun", serif',
  kaiti:    '"Kaiti SC", "STKaiti", "楷体", "KaiTi", "BiauKai", "PingFang SC", cursive',
  yahei:    '"Microsoft YaHei", "微软雅黑", "PingFang SC", -apple-system, system-ui, sans-serif',
  yuanti:   '"STYuanti SC", "华文圆体", "YouYuan", "幼圆", "PingFang SC", "Microsoft YaHei", sans-serif',
  zhongsong:'"STZhongsong", "华文中宋", "STSong", "SimSun", "Source Han Serif SC", serif',
};
const FONT_STYLES = {};
// 不同字体的基准字号（装饰字体需放大，像素字体需缩小）
const FONT_SIZES = {
  default:  "14px",
  songti:   "14px",
  kaiti:    "15px",
  yahei:    "14px",
  yuanti:   "14px",
  zhongsong:"15px",
};
// 古风字体默认加粗，避免纤细看不清
const FONT_WEIGHTS = {
  zhongsong: "500",
  kaiti:    "500",
};
const FONT_NAMES = { default:"跟随主题", songti:"宋体", kaiti:"楷体", yahei:"微软雅黑", yuanti:"圆体", zhongsong:"华文中宋" };
function applyFont(font){
  if(!FONT_STACKS[font]) font = "default";
  if(font === "default"){
    document.documentElement.style.removeProperty("--font");
    document.documentElement.style.removeProperty("--font-style");
    document.documentElement.style.removeProperty("--font-size");
    document.documentElement.style.removeProperty("--font-weight");
  } else {
    document.documentElement.style.setProperty("--font", FONT_STACKS[font]);
    document.documentElement.style.setProperty("--font-style", FONT_STYLES[font]||"normal");
    document.documentElement.style.setProperty("--font-size", FONT_SIZES[font]||"14px");
    if(FONT_WEIGHTS[font]) document.documentElement.style.setProperty("--font-weight", FONT_WEIGHTS[font]);
    else document.documentElement.style.removeProperty("--font-weight");
  }
  try { localStorage.setItem("wb-font", font); } catch(e){}
  document.querySelectorAll(".fs-opt").forEach(btn=>{
    btn.classList.toggle("active", btn.dataset.font === font);
  });
}
function initFontSwitcher(){
  const saved = (()=>{ try{ return localStorage.getItem("wb-font"); }catch(e){ return null; } })();
  applyFont(saved || "default");
  document.querySelectorAll(".fs-opt").forEach(btn=>{
    btn.onclick = ()=>{
      const f = btn.dataset.font;
      applyFont(f);
      toast({ type:"info", title:"字体已切换", msg: FONT_NAMES[f]||"", duration: 1600 });
    };
  });
}
initFontSwitcher();
